name: Tambah label versi RT Kita

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/label-versi.yml'

permissions:
  contents: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tambah label versi di footer
        run: |
          set -e
          grep -q 'Versi 22-10-2026' index.html && exit 0
          sed -i 's/Created by ayah CiaraChana/Created by ayah CiaraChana \&middot; Versi 22-10-2026/' index.html
          test "$(grep -c 'Versi 22-10-2026' index.html)" = "2"
          git config user.name "setiawanw613-blip"
          git config user.email "setiawanw613@gmail.com"
          git add index.html
          git commit -m "Tambah label versi 22-10-2026"
          git push
