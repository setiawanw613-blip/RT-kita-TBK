name: Terapkan perbaikan RT Kita 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terapkan-perbaikan-2.yml'

permissions:
  contents: write

jobs:
  terapkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file perbaikan dan cek keasliannya
        run: |
          set -e
          mkdir -p /tmp/baru
          curl -fsSL "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/10/22/3ed61250.html?expires=1792673678&sig=e3845b79eee636aed7ce551624a8edfda19fef81267da61609f5cc66c52a1dff" -o /tmp/baru/index.html
          curl -fsSL "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/10/22/953079ee.js?expires=1792673679&sig=70d7851f0d2b32e3bfd76edba012191beb24e76f3b8d3c06d2e307a6a26a4fb8" -o /tmp/baru/server.js
          echo "265a43e4fe8c12c951997f7f7e70ba2ffe955279585c157fa33340b9f00d7274  /tmp/baru/index.html" | sha256sum -c -
          echo "b73e8617e1dd049695b873191171986cd30b787553941133b777861b2ca4135c  /tmp/baru/server.js" | sha256sum -c -
          node --check /tmp/baru/server.js
          cp /tmp/baru/index.html index.html
          cp /tmp/baru/server.js server.js
      - name: Simpan perubahan
        run: |
          git config user.name "setiawanw613-blip"
          git config user.email "setiawanw613@gmail.com"
          git add index.html server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kas RT: tampilkan nama pembayar iuran; Surat: tampilkan nama & identitas pengaju"
          git push
