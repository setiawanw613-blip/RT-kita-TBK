<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1267c9">
<link rel="manifest" href="/manifest.webmanifest">
<title>RT Kita</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6fa;color:#172334}
.wrap{max-width:480px;margin:auto;min-height:100vh;background:#fff}
.login{min-height:100vh;padding:35px 24px;background:linear-gradient(150deg,#0e63c5,#15a47d);color:#fff}
.logo{font-size:42px}
.login h1{margin:8px 0}
.box{background:#fff;color:#172334;border-radius:22px;padding:20px;margin-top:25px;box-shadow:0 15px 40px #0002}
.input,select,textarea{width:100%;padding:13px;border:1px solid #dce3eb;border-radius:11px;margin:7px 0 12px;font:inherit}
textarea{min-height:100px}
button{border:0;border-radius:11px;padding:12px 15px;background:#1267c9;color:#fff;font-weight:700;font-size:14px}
.full{width:100%}
.top{background:#1267c9;color:#fff;padding:17px}
.toprow{display:flex;justify-content:space-between}
.content{padding:16px 16px 90px}
.hello{padding:17px;background:#eef6ff;border-radius:16px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #e6ebf1;border-radius:15px;padding:14px;box-shadow:0 3px 12px #00000008}
.stat b{font-size:21px;display:block;margin-top:5px}
.muted{color:#718094;font-size:12px}
.menus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu{text-align:center;padding:13px 5px;border:1px solid #e4e9ef;border-radius:13px;font-size:12px;background:#fff;cursor:pointer}
.menu span{display:block;font-size:24px;margin-bottom:5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}
.section{margin-top:18px}
.section h2{font-size:18px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:65px;background:#fff;border-top:1px solid #e6ebf1;display:flex;justify-content:space-around;align-items:center}
.tab{text-align:center;font-size:10px;color:#7b8795;cursor:pointer}
.tab b{display:block;font-size:21px}
.tab.active{color:#1267c9}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef6ff;color:#1267c9;font-size:11px}
</style>
</head>

<body>
<div id="app" class="wrap"></div>

<script>
const A=document.getElementById("app");

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

async function api(url,opt={}){
  const r=await fetch(url,{
    ...opt,
    headers:{
      "Content-Type":"application/json",
      ...(opt.headers||{})
    }
  });

  const d=await r.json().catch(()=>({}));

  if(!r.ok) throw Error(d.error||"Terjadi kesalahan");

  return d;
}

function login(){
  A.innerHTML=`
  <div class="login">
    <div class="logo">🏠</div>
    <h1>RT Kita</h1>
    <p>Aplikasi layanan dan administrasi RT.</p>

    <div class="box">
      <h2>Masuk</h2>

      <label>Username</label>
      <input id="username" class="input" placeholder="Username">

      <label>Password</label>
      <input id="password" type="password" class="input" placeholder="Password">

      <button class="full" onclick="doLogin()">Masuk ke Aplikasi</button>

      <p class="muted" style="margin-top:15px">
        Akun awal Ketua RT: <b>admin</b> / <b>admin123</b>
      </p>
    </div>
  </div>`;
}

async function doLogin(){
  try{
    await api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        username:username.value,
        password:password.value
      })
    });

    adminHome();
  }catch(e){
    alert(e.message);
  }
}

async function boot(){
  try{
    const x=await api("/api/me");

    if(x.user && x.user.role==="admin"){
      adminHome();
    }else{
      login();
    }
  }catch(e){
    login();
  }
}

async function adminHome(){
  try{
    const d=await api("/api/dashboard");

    A.innerHTML=`
    <header class="top">
      <div class="toprow">
        <div>
          <b>🏠 RT 01 / RW 05</b>
          <div style="font-size:12px;color:#dbeaff">Dashboard Ketua RT</div>
        </div>
        <span>🔔 👤</span>
      </div>
    </header>

    <main class="content">

      <div class="hello">
        <b>Selamat datang, Ketua RT 👋</b>
        <div class="muted">Kelola data dan layanan warga dari satu tempat.</div>
      </div>

      <div class="grid">
        <div class="card stat">
          👥
          <b>${d.residents||0}</b>
          <span class="muted">Warga aktif</span>
        </div>

        <div class="card stat">
          📄
          <b>${d.letters||0}</b>
          <span class="muted">Surat diajukan</span>
        </div>

        <div class="card stat">
          🚨
          <b>${d.complaints||0}</b>
          <span class="muted">Pengaduan baru</span>
        </div>

        <div class="card stat">
          💰
          <b>Rp ${Number(d.balance||0).toLocaleString("id-ID")}</b>
          <span class="muted">Saldo kas</span>
        </div>
      </div>

      <div class="section">
        <h2>Menu Utama</h2>

        <div class="menus">

          <div class="menu" onclick="residents()">
            <span>👥</span>
            Data Warga
          </div>

          <div class="menu" onclick="cash()">
            <span>💰</span>
            Kas RT
          </div>

          <div class="menu" onclick="letters()">
            <span>📄</span>
            Surat
          </div>

          <div class="menu" onclick="announcements()">
            <span>📢</span>
            Pengumuman
          </div>

          <div class="menu" onclick="logout()">
            <span>🚪</span>
            Keluar
          </div>

        </div>
      </div>

      <div class="section">
        <h2>Informasi</h2>

        <div class="card">
          Database aplikasi sudah terpisah dari Google Sheets.
          Data tersimpan di database RT sendiri.
        </div>
      </div>

    </main>

    <nav class="tabs">
      <div class="tab active" onclick="adminHome()">
        <b>⌂</b>Beranda
      </div>

      <div class="tab" onclick="residents()">
        <b>👥</b>Warga
      </div>

      <div class="tab" onclick="cash()">
        <b>💰</b>Kas
      </div>

      <div class="tab" onclick="letters()">
        <b>📄</b>Surat
      </div>
    </nav>`;

  }catch(e){
    alert(e.message);
  }
}

async function residents(){
  try{
    const rows=await api("/api/residents");

    A.querySelector("main").innerHTML=`
      <h2>Data Warga</h2>

      <button onclick="addResident()">+ Tambah Warga</button>

      <div class="section">
        ${
          rows.length
          ? rows.map(r=>`
            <div class="card" style="margin:8px 0">
              <b>${esc(r.nama)}</b>

              <div class="muted">
                ${esc(r.alamat||"-")}
              </div>

              <div class="row">
                <span>NIK</span>
                <span>${esc(r.nik||"-")}</span>
              </div>

              <div class="row">
                <span>No. HP</span>
                <span>${esc(r.no_hp||"-")}</span>
              </div>
            </div>
          `).join("")
          : `<div class="card" style="margin-top:10px">
              Belum ada data warga.
            </div>`
        }
      </div>`;
  }catch(e){
    alert(e.message);
  }
}

function addResident(){
  A.querySelector("main").innerHTML=`
    <h2>Tambah Warga</h2>

    <div class="card">

      <input id="nama" class="input" placeholder="Nama lengkap">

      <input id="nik" class="input" placeholder="NIK">

      <input id="kk" class="input" placeholder="No. KK">

      <input id="alamat" class="input" placeholder="Alamat">

      <input id="hp" class="input" placeholder="No. HP">

      <button onclick="saveResident()">Simpan</button>

      <button onclick="adminHome()"
        style="background:#777">
        Batal
      </button>

    </div>`;
}

async function saveResident(){
  try{
    await api("/api/residents",{
      method:"POST",
      body:JSON.stringify({
        nama:nama.value,
        nik:nik.value,
        no_kk:kk.value,
        alamat:alamat.value,
        no_hp:hp.value
      })
    });

    alert("Data warga berhasil disimpan.");

    residents();

  }catch(e){
    alert(e.message);
  }
}

async function cash(){
  try{
    const rows=await api("/api/cash");

    A.querySelector("main").innerHTML=`
      <h2>Kas RT</h2>

      <button onclick="addCash()">+ Catat Transaksi</button>

      <div class="section">

      ${
        rows.length
        ? rows.map(x=>`
          <div class="card" style="margin:8px 0">

            <b>${esc(x.keterangan||"-")}</b>

            <div class="muted">
              ${esc(x.jenis||"-")}
            </div>

            <strong>
              Rp ${Number(x.jumlah||0).toLocaleString("id-ID")}
            </strong>

          </div>
        `).join("")
        : `<div class="card" style="margin-top:10px">
            Belum ada transaksi.
          </div>`
      }

      </div>`;
  }catch(e){
    alert(e.message);
  }
}

function addCash(){
  A.querySelector("main").innerHTML=`
    <h2>Transaksi Kas</h2>

    <div class="card">

      <select id="ct" class="input">
        <option value="Masuk">Masuk</option>
        <option value="Keluar">Keluar</option>
      </select>

      <input id="cd" class="input" placeholder="Keterangan">

      <input id="ca" type="number"
        class="input"
        placeholder="Jumlah">

      <button onclick="saveCash()">Simpan</button>

    </div>`;
}

async function saveCash(){
  try{
    await api("/api/cash",{
      method:"POST",
      body:JSON.stringify({
        type:ct.value,
        description:cd.value,
        amount:ca.value
      })
    });

    alert("Transaksi kas berhasil disimpan.");

    adminHome();

  }catch(e){
    alert(e.message);
  }
}

async function letters(){
  try{
    const rows=await api("/api/letters");

    A.querySelector("main").innerHTML=`
      <h2>Pengajuan Surat</h2>

      ${
        rows.length
        ? rows.map(x=>`
          <div class="card" style="margin:8px 0">
            <b>${esc(x.type||"-")}</b>

            <div>${esc(x.nama||"Warga")}</div>

            <div class="muted">
              ${esc(x.purpose||"")}
            </div>

            <span class="pill">
              ${esc(x.status||"-")}
            </span>
          </div>
        `).join("")
        : `<div class="card">
            Belum ada pengajuan surat.
          </div>`
      }`;
  }catch(e){
    alert(e.message);
  }
}

async function announcements(){
  try{
    const rows=await api("/api/announcements");

    A.querySelector("main").innerHTML=`
      <h2>Pengumuman</h2>

      <button onclick="addAnnouncement()">
        + Buat Pengumuman
      </button>

      <div class="section">

      ${
        rows.length
        ? rows.map(x=>`
          <div class="card" style="margin:8px 0">
            <b>${esc(x.title)}</b>

            <div>${esc(x.content)}</div>

            <div class="muted">
              ${esc(x.created_at||"")}
            </div>
          </div>
        `).join("")
        : `<div class="card">
            Belum ada pengumuman.
          </div>`
      }

      </div>`;
  }catch(e){
    alert(e.message);
  }
}

function addAnnouncement(){
  A.querySelector("main").innerHTML=`
    <h2>Pengumuman Baru</h2>

    <div class="card">

      <input id="at"
        class="input"
        placeholder="Judul">

      <textarea id="ac"
        placeholder="Isi pengumuman"></textarea>

      <button onclick="saveAnnouncement()">
        Terbitkan
      </button>

    </div>`;
}

async function saveAnnouncement(){
  try{
    await api("/api/announcements",{
      method:"POST",
      body:JSON.stringify({
        title:at.value,
        content:ac.value
      })
    });

    alert("Pengumuman berhasil dibuat.");

    announcements();

  }catch(e){
    alert(e.message);
  }
}

async function logout(){
  try{
    await api("/api/logout",{method:"POST"});
  }catch(e){}

  login();
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}

boot();
</script>
</body>
</html>
