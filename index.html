async function api(url,options={}){
  const res=await fetch(url,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    },
    ...options
  });

  const text=await res.text();
  let data=null;

  try{data=text?JSON.parse(text):null}
  catch{data={message:text}}

  if(!res.ok){
    throw new Error(data?.message||data?.error||"Terjadi kesalahan");
  }

  return data;
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function rupiah(value){
  return "Rp "+Number(value||0).toLocaleString("id-ID");
}

  const no_kk=document.getElementById("regKk").value.trim();
    const hubungan_keluarga=document.getElementById("regHubungan").value;
  const no_hp=document.getElementById("regHp").value.trim();
  const password=document.getElementById("regPassword").value.trim();
  const alamat=document.getElementById("regAlamat").value.trim();

 if(!nama_lengkap || !no_kk || !no_hp || !password || !alamat || !hubungan_keluarga){
  alert("Semua data wajib diisi");
  return;
}

if(hubungan_keluarga !== "Anak" && !nik){
  alert("NIK wajib diisi untuk hubungan ini");
  return;
}

  try{
    const data=await api("/api/register-warga",{
      method:"POST",
     body:JSON.stringify({
  nama_lengkap,
  nik,
  no_kk,
  hubungan_keluarga,
  no_hp,
  password,
  alamat
})
    });

    alert("Pendaftaran berhasil. Silakan masuk menggunakan nomor HP dan password.");

    loginPage();
    document.getElementById("role").value="warga";

  }catch(e){

  }
}
async function doLogin(){
  const role=document.getElementById("role").value;
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!username||!password){
    loginPage("Data login wajib diisi");
    document.getElementById("role").value=role;
    changeLoginForm();
    return;
  }

  try{
    const data=await api("/api/login",{
      method:"POST",
      body:JSON.stringify({username,password,role})
    });

    currentUser=data.user;

    if(currentUser.role==="warga"){
      wargaHome();
    }else{
      adminHome();
    }
  }catch(e){
    loginPage(e.message);
    document.getElementById("role").value=role;
    changeLoginForm();
  }
}

function filterResidents(){
  const data = Array.isArray(window._residentRows)
    ? window._residentRows
    : [];

  const input = document.getElementById("residentSearch");
  const box = document.getElementById("residentList");
  const count = document.getElementById("residentCount");

  if(!input || !box) return;

  const q = input.value.trim().toLowerCase();

  const filtered = data.filter(w => [
    w.nama_lengkap,
    w.nama,
    w.nik,
    w.no_kk,
    w.no_hp,
    w.alamat,
    w.status_warga
  ].some(v => String(v || "").toLowerCase().includes(q)));

  if(count){
    count.textContent =
      `Menampilkan ${filtered.length} dari ${data.length} warga`;
  }

  if(!filtered.length){
    box.innerHTML =
      "<p class='muted'>Warga tidak ditemukan.</p>";
    return;
  }

  box.innerHTML = filtered.map(w=>`
    <div class="row"
      style="cursor:pointer"
      onclick='showResidentDetail(${JSON.stringify(w).replace(/'/g,"&#39;")})'>

      <b>${esc(w.nama_lengkap||w.nama)}</b>
      <div class="muted">NIK: ${esc(w.nik)}</div>
      <div class="muted">No. KK: ${esc(w.no_kk)}</div>
      <div class="muted">${esc(w.alamat)}</div>
      <div class="muted">${esc(w.no_hp)}</div>

      <div class="muted" style="margin-top:6px">
        Status: ${esc(w.status_warga || "")}
      </div>

      ${
        w.status_warga === "menunggu_verifikasi"
        ? `
          <button class="btn" style="margin-top:8px"
            onclick="event.stopPropagation(); verifyResident(${w.id})">
            ✅ Verifikasi
          </button>
        `
        : w.status_warga === "aktif"
        ? `
          <button class="btn secondary" style="margin-top:8px"
            onclick="event.stopPropagation(); deactivateResident(${w.id})">
            ⛔ Nonaktifkan
          </button>
        `
        : ""
      }
    </div>
  `).join("");
}

async function saveResident(event,id){
  event.preventDefault();

  const keys = [
    "nik","no_kk","nama_lengkap",
    "tempat_lahir","tanggal_lahir","alamat","rt","rw",
    "pekerjaan","no_hp","jenis_kelamin",
    "status_perkawinan","status_hunian","hubungan_keluarga"
  ];

  const body = {};

  for(const key of keys){
    const el = document.getElementById("edit_"+key);

    if(el){
      const value = el.value.trim();

      if(key === "tanggal_lahir"){
        body[key] = value || null;
      }else{
        body[key] = value;
      }
    }
  }

function getCashCategory(x){
  const kategori = String(x.kategori || "").trim();
  const keterangan =
    String(x.description || x.keterangan || "").toLowerCase();

  if(keterangan.includes("keamanan")){
    return "Keamanan";
  }

  if(keterangan.includes("sampah")){
    return "Sampah";
  }

  if(keterangan.includes("kas rt")){
    return "Kas RT";
  }

  if(kategori){
    return kategori;
  }

  if(keterangan.includes("kegiatan")){
    return "Kegiatan RT";
  }

  if(
    keterangan.includes("sarana") ||
    keterangan.includes("prasarana")
  ){
    return "Sarana/Prasarana";
  }

  return x.type === "masuk"
    ? "Pemasukan Lainnya"
    : "Pengeluaran";
}

    } else {

function filterCashAdmin(){
  const rows = Array.isArray(window._cashAdminRows)
    ? window._cashAdminRows
    : [];

  const type =
    document.getElementById("cashTypeFilter")?.value || "";

  const category =
    document.getElementById("cashCategoryFilter")?.value || "";

  const filtered = rows.filter(x=>{
    if(type && x.type !== type){
      return false;
    }

    const kat = getCashCategory(x);

    if(category && kat !== category){
      return false;
    }

    return true;
  });

  renderCashAdmin(filtered);
}

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"

async function lihatBuktiCash(id){
  let tab = null;

  try{
    if(!id || !Number.isInteger(Number(id))){
      alert("ID transaksi tidak valid.");
      return;
    }

    tab = window.open("about:blank", "_blank");

    const hasil = await api(
      `/api/cash/proof/${encodeURIComponent(id)}`
    );

    if(!hasil || !hasil.ok || !hasil.url){
      throw new Error(
        hasil?.message || "Bukti pengeluaran tidak ditemukan."
      );
    }

    if(tab){
      tab.location.href = hasil.url;
    }else{
      window.location.href = hasil.url;
    }

  }catch(e){
    if(tab){
      tab.close();
    }

    alert(
      e.message || "Gagal membuka bukti pengeluaran."
    );
  }
}

function ubahFormCash(){
  const jenis = document.getElementById("cashType");
  const bungkus = document.getElementById("cashProofWrap");
  const bukti = document.getElementById("cashProof");

  if(!jenis || !bungkus || !bukti) return;

  const pengeluaran = jenis.value === "keluar";
  bungkus.style.display = pengeluaran ? "block" : "none";
  bukti.required = pengeluaran;
}

async function saveCash(){
  try{
    const type = document.getElementById("cashType").value;
    const category = document.getElementById("cashCategory").value;
    const date = document.getElementById("cashDate").value;
    const description = document.getElementById("cashDesc").value.trim();
    const amount = document.getElementById("cashAmount").value;
    const proofInput = document.getElementById("cashProof");

    if(
      !category ||
      !date ||
      !description ||
      !amount ||
      !Number.isFinite(Number(amount)) ||
      Number(amount) <= 0
    ){
      alert("Lengkapi kategori, tanggal, keterangan, dan jumlah.");
      return;
    }

    let proofPath = null;

    if(type === "keluar"){
      if(!proofInput || !proofInput.files.length){
        alert("Bukti pengeluaran wajib dilampirkan.");
        return;
      }

      const file = proofInput.files[0];
      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if(!allowedTypes.includes(file.type)){
        alert("Bukti harus berupa JPG, PNG, atau WebP.");
        return;
      }

      if(file.size > 5 * 1024 * 1024){
        alert("Ukuran foto maksimal 5 MB.");
        return;
      }

      const uploadResponse = await fetch("/api/cash/proof", {
        method: "POST",
        headers: {
          "Content-Type": file.type
        },
        body: file
      });

      const uploadResult = await uploadResponse.json();

      if(
        !uploadResponse.ok ||
        !uploadResult.ok ||
        !uploadResult.path
      ){
        throw new Error(
          uploadResult.message || "Gagal mengunggah bukti."
        );
      }

      proofPath = uploadResult.path;
    }

    await api("/api/cash", {
      method: "POST",
      body: JSON.stringify({
        type,
        category,
        date,
        description,
        amount,
        proof: proofPath
      })
    });

    alert("Transaksi berhasil disimpan.");
    cash();

  }catch(e){
    alert(e.message || "Gagal menyimpan transaksi.");
  }
}

`;

document.getElementById("kasDetailModal").scrollIntoView({behavior:"smooth",block:"start"});
    };

  }catch(e){

async function myData(){
  layout("Data Saya",`
    <div class="card" id="myDataBox">Memuat...</div>
    <button class="btn secondary" onclick="wargaHome()">Kembali</button>
  `);

  try{
    const w=await api("/api/my-data");
    const box=document.getElementById("myDataBox");

    if(!w){
      box.innerHTML="<p class='muted'>Data warga tidak ditemukan</p>";
      return;
    }

    box.innerHTML=`
  <h3>${esc(w.nama_lengkap)}</h3>
  <div class="row"><b>NIK</b><br>${esc(w.nik)}</div>
  <div class="row"><b>No. KK</b><br>${esc(w.no_kk)}</div>
  <div class="row"><b>Jenis Kelamin</b><br>${esc(w.jenis_kelamin)}</div>
  <div class="row"><b>Tempat/Tanggal Lahir</b><br>${esc(w.tempat_lahir)} / ${esc(w.tanggal_lahir)}</div>
  <div class="row"><b>Alamat</b><br>${esc(w.alamat)}</div>
  <div class="row"><b>RT/RW</b><br>${esc(w.rt)} / ${esc(w.rw)}</div>
  <div class="row"><b>Status Perkawinan</b><br>${esc(w.status_perkawinan)}</div>
  <div class="row"><b>Pekerjaan</b><br>${esc(w.pekerjaan)}</div>
  <div class="row"><b>Status Hunian</b><br>${esc(w.status_hunian)}</div>
  <div class="row"><b>No. HP</b><br>${esc(w.no_hp)}</div>
  <div class="row"><b>Status Warga</b><br>${esc(w.status_warga)}</div>

  <button class="btn" style="width:100%;margin-top:16px"
    onclick="editMyData()">
    ✏️ Lengkapi Data
  </button>
`;
      
  }catch(e){
    document.getElementById("myDataBox").innerHTML=
      `<div class="error">${esc(e.message)}</div>`;
  }
}
async function saveMyData(){
  const jenis_kelamin=document.getElementById("editJenisKelamin").value;
  const tempat_lahir=document.getElementById("editTempatLahir").value.trim();
  const tanggal_lahir=document.getElementById("editTanggalLahir").value;
  const alamat=document.getElementById("editAlamat").value.trim();
  const rt=document.getElementById("editRt").value.trim();
  const rw=document.getElementById("editRw").value.trim();
  const status_perkawinan=document.getElementById("editStatusPerkawinan").value;
  const pekerjaan=document.getElementById("editPekerjaan").value.trim();
  const status_hunian=document.getElementById("editStatusHunian").value;

  if(!jenis_kelamin || !tempat_lahir || !tanggal_lahir || !alamat || !rt || !rw || !status_perkawinan || !pekerjaan){
    alert("Semua data wajib diisi");
    return;
  }

  try{
    await api("/api/my-data",{
      method:"PATCH",
      body:JSON.stringify({
        jenis_kelamin,
        tempat_lahir,
        tanggal_lahir,
        alamat,
        rt,
        rw,
        status_perkawinan,
        pekerjaan,
        status_hunian
      })
    });

    alert("Data warga berhasil disimpan");
    myData();

  }catch(e){
    alert(e.message || "Gagal menyimpan data");
  }
}

async function saveLetter(){
  try{
    await api("/api/letters",{
      method:"POST",
      body:JSON.stringify({
        type:document.getElementById("letterType").value,
        purpose:document.getElementById("letterPurpose").value.trim()
      })
    });

    alert("Pengajuan surat berhasil dikirim");
    myLetters();
  }catch(e){
    alert(e.message);
  }
}

async function myLetters(){
  layout("Surat Saya",`
    <div class="card" id="myLetterList">Memuat...</div>
    <button class="btn" onclick="newLetter()">+ Ajukan surat</button>
    <button class="btn secondary" style="margin-top:8px" onclick="wargaHome()">Kembali</button>
  `);

  try{
    const data=await api("/api/my-letters");
    const box=document.getElementById("myLetterList");

    if(!data.length){
      box.innerHTML="<p class='muted'>Belum ada pengajuan surat</p>";
      return;
    }

    box.innerHTML=data.map(x=>`
      <div class="row">
        <b>${esc(x.type||x.jenis_surat)}</b>
        <div>${esc(x.purpose||x.keperluan)}</div>
        <div style="margin-top:6px">
          <span class="badge">${esc(x.status)}</span>
        </div>
        ${x.catatan?`<div class="muted">Catatan RT: ${esc(x.catatan)}</div>`:""}
      </div>
    `).join("");
  }catch(e){
    document.getElementById("myLetterList").innerHTML=
      `<div class="error">${esc(e.message)}</div>`;
  }
}

async function announcementsWarga(){
  layout("Pengumuman RT",`
