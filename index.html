<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1267c9"><link rel="manifest" href="/manifest.webmanifest"><title>RT Kita</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6fa;color:#172334}.wrap{max-width:480px;margin:auto;min-height:100vh;background:#fff}.login{min-height:100vh;padding:35px 24px;background:linear-gradient(150deg,#0e63c5,#15a47d);color:#fff}.logo{font-size:42px}.login h1{margin:8px 0}.login p{opacity:.9}.box{background:#fff;color:#172334;border-radius:22px;padding:20px;margin-top:25px;box-shadow:0 15px 40px #0002}.input,select,textarea{width:100%;padding:13px;border:1px solid #dce3eb;border-radius:11px;margin:7px 0 12px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:11px;padding:12px 15px;background:#1267c9;color:#fff;font-weight:700;font-size:14px}.full{width:100%}.top{background:#1267c9;color:#fff;padding:17px}.top.green{background:#0b9475}.toprow{display:flex;justify-content:space-between}.content{padding:16px 16px 90px}.hello{padding:17px;background:#eef6ff;border-radius:16px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e6ebf1;border-radius:15px;padding:14px;box-shadow:0 3px 12px #00000008}.stat b{font-size:21px;display:block;margin-top:5px}.muted{color:#718094;font-size:12px}.menus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.menu{text-align:center;padding:13px 5px;border:1px solid #e4e9ef;border-radius:13px;font-size:12px;background:#fff}.menu span{display:block;font-size:24px;margin-bottom:5px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}.row:last-child{border:0}.section{margin-top:18px}.section h2{font-size:18px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:65px;background:#fff;border-top:1px solid #e6ebf1;display:flex;justify-content:space-around;align-items:center}.tab{text-align:center;font-size:10px;color:#7b8795}.tab b{display:block;font-size:21px}.tab.active{color:#1267c9}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef6ff;color:#1267c9;font-size:11px}.danger{background:#fff0f0;color:#c62828}.success{background:#eaf9f3;color:#08785e}.hide{display:none}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:end center}.modal>div{background:#fff;width:min(480px,100%);padding:20px;border-radius:20px 20px 0 0}.link{background:none;color:#1267c9;padding:0}
</style></head><body><div id="app" class="wrap"></div><script>
const A=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||"Terjadi kesalahan");return d}
function login(){A.innerHTML=`<div class="login"><div class="logo">🏠</div><h1>RT Kita</h1><p>Aplikasi layanan dan administrasi RT.</p><div class="box"><h2>Masuk</h2><label>Username</label><input id="u" class="input" placeholder="Username"><label>Password</label><input id="p" type="password" class="input" placeholder="Password"><button class="full" onclick="doLogin()">Masuk ke Aplikasi</button><p class="muted" style="margin-top:15px">Akun awal Ketua RT: <b>admin</b> / <b>admin123</b></p></div></div>`}
async function doLogin(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});boot()}catch(e){alert(e.message)}}
async function boot(){let x=await api("/api/me"); if(!x.user)return login(); x.user.role==="admin"?adminHome():wargaHome()}
async function adminHome(){let d=await api("/api/dashboard");A.innerHTML=`<header class="top"><div class="toprow"><div><b>🏠 RT 01 / RW 05</b><div class="muted" style="color:#dbeaff">Dashboard Ketua RT</div></div><span>🔔 👤</span></div></header><main class="content"><div class="hello"><b>Selamat datang, Ketua RT 👋</b><div class="muted">Kelola data dan layanan warga dari satu tempat.</div></div><div class="grid"><div class="card stat">👥<b>${d.residents}</b><span class="muted">Warga aktif</span></div><div class="card stat">📄<b>${d.letters}</b><span class="muted">Surat diajukan</span></div><div class="card stat">🚨<b>${d.complaints}</b><span class="muted">Pengaduan baru</span></div><div class="card stat">💰<b>Rp ${d.balance.toLocaleString("id-ID")}</b><span class="muted">Saldo kas</span></div></div><div class="section"><h2>Menu Utama</h2><div class="menus"><div class="menu" onclick="residents()"><span>👥</span>Data Warga</div><div class="menu" onclick="cash()"><span>💰</span>Kas RT</div><div class="menu" onclick="letters()"><span>📄</span>Surat</div><div class="menu" onclick="complaints()"><span>🚨</span>Pengaduan</div><div class="menu" onclick="announcements()"><span>📢</span>Pengumuman</div><div class="menu" onclick="logout()"><span>🚪</span>Keluar</div></div></div><div class="section"><h2>Informasi</h2><div class="card">Database aplikasi sudah terpisah dari Google Sheets. Data tersimpan di database RT sendiri.</div></div></main><nav class="tabs"><div class="tab active"><b>⌂</b>Beranda</div><div class="tab" onclick="residents()"><b>👥</b>Warga</div><div class="tab" onclick="cash()"><b>💰</b>Kas</div><div class="tab" onclick="letters()"><b>📄</b>Surat</div></nav>`}
async function residents(){let rows=await api("/api/residents");A.querySelector("main").innerHTML=`<div class="sectionhead"><h2>Data Warga</h2><button onclick="addResident()">+ Tambah</button></div><div id="list">${rows.map(r=>`<div class="card" style="margin:8px 0"><b>${esc(r.nama)}</b><div class="muted">${esc(r.alamat)}</div><div class="row"><span>NIK</span><span>${esc(r.nik||"-")}</span></div><div class="row"><span>No. HP</span><span>${esc(r.no_hp||"-")}</span></div></div>`).join("")}</div>`}
function addResident(){A.querySelector("main").innerHTML=`<h2>Tambah Warga</h2><div class="card"><input id="nama" class="input" placeholder="Nama lengkap"><input id="nik" class="input" placeholder="NIK"><input id="kk" class="input" placeholder="No. KK"><input id="alamat" class="input" placeholder="Alamat"><input id="hp" class="input" placeholder="No. HP"><button onclick="saveResident()">Simpan</button> <button onclick="adminHome()">Batal</button></div>`}
async function saveResident(){await api("/api/residents",{method:"POST",body:JSON.stringify({nama:nama.value,nik:nik.value,no_kk:kk.value,alamat:alamat.value,no_hp:hp.value})});residents()}
async function cash(){let rows=await api("/api/cash");A.querySelector("main").innerHTML=`<h2>Kas RT</h2><button onclick="addCash()">+ Catat Transaksi</button><div class="section">${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.description)}</b><div class="muted">${x.type} · ${x.created_at}</div><strong>Rp ${Number(x.amount).toLocaleString("id-ID")}</strong></div>`).join("")||'<div class="card">Belum ada transaksi.</div>'}</div>`}
function addCash(){A.querySelector("main").innerHTML=`<h2>Transaksi Kas</h2><div class="card"><select id="ct" class="input"><option>Masuk</option><option>Keluar</option></select><input id="cd" class="input" placeholder="Keterangan"><input id="ca" type="number" class="input" placeholder="Jumlah"><button onclick="saveCash()">Simpan</button></div>`}
async function saveCash(){await api("/api/cash",{method:"POST",body:JSON.stringify({type:ct.value,description:cd.value,amount:ca.value})});adminHome()}
async function letters(){let rows=await api("/api/letters");A.querySelector("main").innerHTML=`<h2>Pengajuan Surat</h2>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.type)}</b><div>${esc(x.nama||"Warga")}</div><div class="muted">${esc(x.purpose||"")}</div><span class="pill">${x.status}</span></div>`).join("")||'<div class="card">Belum ada pengajuan.</div>'}`}
async function complaints(){let rows=await api("/api/complaints");A.querySelector("main").innerHTML=`<h2>Pengaduan Warga</h2>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div>${esc(x.content)}</div><div class="muted">${esc(x.nama||"Warga")} · ${x.created_at}</div><span class="pill ${x.status==="Selesai"?"success":"danger"}">${x.status}</span></div>`).join("")||'<div class="card">Belum ada pengaduan.</div>'}`}
async function announcements(){let rows=await api("/api/announcements");A.querySelector("main").innerHTML=`<h2>Pengumuman</h2><button onclick="addAnnouncement()">+ Buat Pengumuman</button>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div>${esc(x.content)}</div><div class="muted">${x.created_at}</div></div>`).join("")}`}
function addAnnouncement(){A.querySelector("main").innerHTML=`<h2>Pengumuman Baru</h2><div class="card"><input id="at" class="input" placeholder="Judul"><textarea id="ac" placeholder="Isi pengumuman"></textarea><button onclick="saveAnnouncement()">Terbitkan</button></div>`}
async function saveAnnouncement(){await api("/api/announcements",{method:"POST",body:JSON.stringify({title:at.value,content:ac.value})});announcements()}
async function wargaHome(){let d=await api("/api/my-data"),an=await api("/api/announcements");A.innerHTML=`<header class="top green"><div class="toprow"><div><b>🏠 RT 01 / RW 05</b><div class="muted" style="color:#dff9f0">Layanan Warga</div></div><span>🔔 👤</span></div></header><main class="content"><div class="hello"><b>Halo, ${esc(d.nama)} 👋</b><div class="muted">Selamat datang di layanan RT.</div></div><div class="card"><h2 style="margin-top:0">👤 Data Saya</h2><div class="row"><span>Nama</span><b>${esc(d.nama)}</b></div><div class="row"><span>No. KK</span><b>${esc(d.no_kk||"-")}</b></div><div class="row"><span>Alamat</span><b>${esc(d.alamat||"-")}</b></div><div class="row"><span>No. HP</span><b>${esc(d.no_hp||"-")}</b></div></div><div class="section"><h2>Layanan</h2><div class="menus"><div class="menu" onclick="newLetter()"><span>📄</span>Ajukan Surat</div><div class="menu" onclick="myLetters()"><span>📋</span>Surat Saya</div><div class="menu" onclick="newComplaint()"><span>🚨</span>Pengaduan</div><div class="menu" onclick="myComplaints()"><span>📨</span>Laporan Saya</div><div class="menu" onclick="showAnnouncements()"><span>📢</span>Pengumuman</div><div class="menu" onclick="logout()"><span>🚪</span>Keluar</div></div></div><div class="section"><h2>Pengumuman Terbaru</h2>${an.slice(0,2).map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div>${esc(x.content)}</div></div>`).join("")}</div></main><nav class="tabs"><div class="tab active"><b>⌂</b>Beranda</div><div class="tab"><b>👤</b>Data Saya</div><div class="tab" onclick="newLetter()"><b>▦</b>Layanan</div><div class="tab" onclick="showAnnouncements()"><b>🔔</b>Info</div></nav>`}
async function newLetter(){A.querySelector("main").innerHTML=`<h2>Ajukan Surat</h2><div class="card"><select id="lt" class="input"><option>Surat Pengantar</option><option>Surat Domisili</option><option>Surat Keterangan</option><option>Lainnya</option></select><textarea id="lp" placeholder="Keperluan surat"></textarea><button onclick="saveLetter()">Kirim Pengajuan</button></div>`}
async function saveLetter(){await api("/api/letters",{method:"POST",body:JSON.stringify({type:lt.value,purpose:lp.value})});wargaHome();alert("Pengajuan surat sudah dikirim ke Ketua RT.")}
async function myLetters(){let rows=await api("/api/letters");A.querySelector("main").innerHTML=`<h2>Surat Saya</h2>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.type)}</b><div>${esc(x.purpose)}</div><span class="pill">${x.status}</span></div>`).join("")||'<div class="card">Belum ada pengajuan.</div>'}`}
async function newComplaint(){A.querySelector("main").innerHTML=`<h2>Pengaduan</h2><div class="card"><input id="ctitle" class="input" placeholder="Judul pengaduan"><textarea id="ccontent" placeholder="Ceritakan masalahnya"></textarea><button onclick="saveComplaint()">Kirim Pengaduan</button></div>`}
async function saveComplaint(){await api("/api/complaints",{method:"POST",body:JSON.stringify({title:ctitle.value,content:ccontent.value})});wargaHome();alert("Pengaduan berhasil dikirim.")}
async function myComplaints(){let rows=await api("/api/complaints");A.querySelector("main").innerHTML=`<h2>Laporan Saya</h2>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div>${esc(x.content)}</div><span class="pill">${x.status}</span></div>`).join("")||'<div class="card">Belum ada laporan.</div>'}`}
async function showAnnouncements(){let rows=await api("/api/announcements");A.querySelector("main").innerHTML=`<h2>Pengumuman RT</h2>${rows.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div>${esc(x.content)}</div><div class="muted">${x.created_at}</div></div>`).join("")}`}
async function logout(){await api("/api/logout",{method:"POST"});login()}
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});boot().catch(login)
</script></body></html>
