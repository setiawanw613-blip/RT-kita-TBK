<body>
<div id="app"></div>

<script>
let currentUser=null;
 

// Gabungkan permintaan identik yang masih berjalan agar ketukan berulang tidak memicu fetch berulang.
const apiRequestsInFlight = new Map();

async function api(url, options = {}) {
  const method = String(options.method || "GET").toUpperCase();
  const bodyKey = typeof options.body === "string"
    ? options.body
    : options.body instanceof FormData
      ? "[form-data]"
      : "";
  const requestKey = method + ":" + url + ":" + bodyKey;

  if (apiRequestsInFlight.has(requestKey)) {
    return apiRequestsInFlight.get(requestKey);
  }

  const request = (async () => {
    const headers = { ...(options.headers || {}) };
    const isFormData = options.body instanceof FormData;

    if (!isFormData && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }

    const res = await fetch(url, {
      ...options,
      credentials: "same-origin",
      headers
    });

    const text = await res.text();
    let data = null;

    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = { message: text };
    }

    if (!res.ok) {
      const message =
        data?.message ||
        data?.error ||
        `Permintaan gagal (HTTP ${res.status})`;

      console.error("API ERROR:", {
        url,
        status: res.status,
        response: data
      });

      throw new Error(message);
    }

    return data;
  })();

  apiRequestsInFlight.set(requestKey, request);
  try {
    return await request;
  } finally {
    if (apiRequestsInFlight.get(requestKey) === request) {
      apiRequestsInFlight.delete(requestKey);
    }
  }
}

  function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function rupiah(value) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}
window.onerror = function(message, source, line, column, error) {
  console.error(
    "PELACAK ERROR RT KITA\n\n" +
    "Pesan: " + message + "\n" +
    "Baris: " + line + "\n" +
    "Kolom: " + column + "\n" +
    "Sumber: " + source
  );
};


function layout(title, body, showBack = true) {
  const isWarga = currentUser?.role === "warga";
  const footer = `
      <div style="
        text-align:center;color:#52647a;font-size:12px;line-height:1.6;
        padding:12px 6px 8px;margin-top:10px;border-top:1px solid #e3e9f1;
      ">
        <div style="font-weight:700;color:#174a82">RT TBK — Dari Warga, Untuk Warga</div>
        <div style="font-weight:700;color:#52647a">Created by ayah CiaraChana &middot; Versi 22-10-2026 (2)</div>
      </div>
  `;
  const hasBottomNav = body.includes('class="bottom"') || body.includes('class="admin-bottom"');
  const bodyContent = hasBottomNav
    ? body.replace(/<div class="(?:bottom|admin-bottom)">/, footer + '<div class="' + (isWarga ? 'bottom' : 'admin-bottom') + '">')
    : body;

  document.getElementById("app").innerHTML = `
    <div class="wrap ${title === "Portal Warga" || title === "Dashboard Ketua RT" ? "" : "service-page"}">
      <div style="
        background:linear-gradient(135deg,#1267c9,#0750a4);
        color:white;
        padding:20px 18px;
        border-radius:18px;
        margin-bottom:18px;
        box-shadow:0 5px 16px #1267c926;
      ">
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:12px;
        ">
         <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
<img
  src="/images.png"
  alt="Logo Taman Bali Kahuripan"
  style="width:90px;height:90px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;flex-shrink:0;display:block"
>
  <div style="min-width:0">
    <div style="font-size:25px;font-weight:800">RT TBK</div>
    <div style="font-size:13px;opacity:.92">
      Pelayanan warga digital
    </div>
    <div style="font-size:14px;font-weight:700;margin-top:7px">
      Dari Warga, Untuk Warga
    </div>
  </div>
</div>

          <div style="display:flex;align-items:center;gap:8px">
            <button
              type="button"
              aria-label="Notifikasi"
              title="Notifikasi"
              onclick="bukaNotifikasiHeader()"
              style="
                position:relative;
                width:44px;
                height:44px;
                flex-shrink:0;
                display:flex;
                align-items:center;
                justify-content:center;
                border:1px solid #ffffff70;
                border-radius:50%;
                background:#ffffff18;
                color:white;
                font-size:22px;
                cursor:pointer;
              "
            >
              🔔
              <span id="jumlahNotifikasiHeader" style="
                position:absolute;
                top:-4px;
                right:-4px;
                min-width:17px;
                height:17px;
                padding:0 3px;
                display:none;
                align-items:center;
                justify-content:center;
                border-radius:20px;
                background:#ff304f;
                color:white;
                font-size:10px;
                font-weight:800;
                border:2px solid #1267c9;
              ">0</span>
            </button>

            <button class="btn secondary" onclick="logout()">
              Keluar
            </button>
          </div>
        </div>

        <div style="font-size:12px;margin-top:14px;opacity:.9">
          RT 04 / RW 01 · Taman Bali Kahuripan
        </div>
      </div>

      <div style="font-size:20px;font-weight:800;margin:0 0 14px">
        ${esc(title)}
      </div>

          ${bodyContent}

           ${showBack && !/(← Kembali|>\s*Kembali\s*<\/button>)/i.test(body) ? `
        <button class="btn secondary"
          style="width:100%;margin-top:12px"
          onclick="${isWarga ? 'wargaHome()' : 'dashboard()'}">
          ← Kembali
        </button>
      ` : ""}

      ${hasBottomNav ? "" : footer}
    </div>
  `;

  if (typeof muatNotifikasiHeader === "function") muatNotifikasiHeader();
  if (typeof muatBadgeMenu === "function") muatBadgeMenu();
}
  
function dashboard(){
  boot();
}

async function muatBadgeMenu() {
  try {
    const hasil = await api("/api/notifikasi");
    if (!hasil?.ok) return;
    const hitung = {};
    (hasil.notifikasi || []).filter(n => !n.sudah_dibaca).forEach(n => {
      const jenis = String(n.jenis || "").toLowerCase();
      hitung[jenis] = (hitung[jenis] || 0) + 1;
    });
    document.querySelectorAll("[data-menu-notif]").forEach(el => {
      el.querySelector(".menu-notif-badge")?.remove();
      const jenis = el.getAttribute("data-menu-notif");
      const jumlah = Number(hitung[jenis] || 0);
      if (!jumlah) return;
      const badge = document.createElement("span");
      badge.className = "menu-notif-badge";
      badge.textContent = jumlah > 99 ? "99+" : String(jumlah);
      badge.setAttribute("aria-label", jumlah + " notifikasi belum dibaca");
      el.appendChild(badge);
    });
  } catch (error) {
    console.error("Gagal memuat lencana notifikasi menu:", error);
  }
}

async function muatNotifikasiHeader() {
  try {
    const hasil = await api("/api/notifikasi");
    const jumlah = document.getElementById("jumlahNotifikasiHeader");

    if (!jumlah || !hasil || !hasil.ok) return;

    const belumDibaca = Number(hasil.belum_dibaca || 0);

    jumlah.textContent = belumDibaca > 99 ? "99+" : belumDibaca;
    jumlah.style.display = belumDibaca > 0 ? "flex" : "none";
  } catch (error) {
    console.error("Gagal memuat jumlah notifikasi:", error);
  }
}

// Perbarui lonceng dan badge ketika pengguna kembali ke aplikasi di HP/browser.
if (!window.__rtTbkNotifRefreshBound) {
  window.__rtTbkNotifRefreshBound = true;
  const segarkanNotifikasi = () => {
    if (!currentUser) return;
    Promise.all([muatNotifikasiHeader(), muatBadgeMenu()]);
  };
  window.addEventListener("focus", segarkanNotifikasi);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") segarkanNotifikasi();
  });
}

  

async function tandaiNotifikasiDibaca(id) {
  const notifId = Number(id);
  if (!Number.isSafeInteger(notifId) || notifId <= 0) return;

  try {
    const hasil = await api("/api/notifikasi/" + encodeURIComponent(notifId) + "/baca", {
      method: "PATCH"
    });
    if (!hasil?.ok) throw new Error(hasil?.message || "Gagal menandai notifikasi");

    const kartu = document.getElementById("notifikasi-" + notifId);
    if (kartu) {
      kartu.style.background = "#ffffff";
      const status = document.getElementById("status-notifikasi-" + notifId);

async function bukaNotifikasiHeader() {
  try {
    const hasil = await api("/api/notifikasi");

    if (!hasil || !hasil.ok) {
      throw new Error(hasil?.message || "Gagal memuat notifikasi");
    }

    let daftar = hasil.notifikasi || [];

    // Notifikasi tetap belum dibaca saat panel dibuka.
    // Pengguna menandainya secara eksplisit lewat tombol "Tandai sudah dibaca".
    const lama = document.getElementById("panelNotifikasiHeader");
    if (lama) lama.remove();

    const panel = document.createElement("div");
    panel.id = "panelNotifikasiHeader";

    panel.style.cssText = `
      position:fixed;
      top:90px;
      right:16px;
      width:min(380px,calc(100vw - 32px));
      max-height:70vh;
      overflow:auto;
      padding:16px;
      background:white;
      color:#243447;
      border:1px solid #dce6f2;
      border-radius:14px;
      box-shadow:0 10px 35px #0003;
      z-index:9999;
      box-sizing:border-box;
    `;

    function tampilkanDaftar(items) {
      const isi = items.length
        ? items.map(item => {
            const id = Number(item.id);
            const sudahDibaca = Boolean(item.sudah_dibaca);
            return `
              <div id="notifikasi-${id}" style="
                padding:12px;
                margin-bottom:8px;
                border:1px solid #dce6f2;
                border-radius:10px;
                background:${sudahDibaca ? "#ffffff" : "#eef6ff"};
              ">
                <div style="font-weight:800;color:#174a82">
                  ${esc(item.judul || "Notifikasi")}
                </div>
                <div style="margin-top:5px">
                  ${esc(item.pesan || "")}
                </div>
                <div style="font-size:12px;color:#64748b;margin-top:7px">
                  ${item.dibuat_pada
                    ? new Date(item.dibuat_pada).toLocaleString("id-ID")
                    : ""}
                  · <span id="status-notifikasi-${id}">${sudahDibaca ? "Sudah dibaca" : "Belum dibaca"}</span>
                </div>
                ${!sudahDibaca && Number.isSafeInteger(id) && id > 0 ? `
                  <button type="button" class="btn secondary"
                    style="margin-top:9px;padding:7px 10px;font-size:12px"
                    onclick="tandaiNotifikasiDibaca(${id})">
                    Tandai sudah dibaca
                  </button>
                ` : ""}
              </div>
            `;
          }).join("")
        : "<p>Belum ada notifikasi.</p>";

      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <strong style="font-size:18px">Notifikasi</strong>
          <button type="button" class="btn secondary"
            id="tutupNotifikasiHeader">
            Tutup
          </button>
        </div>
        <div id="isiNotifikasiHeader">${isi}</div>
      `;

      document.getElementById("tutupNotifikasiHeader")
        ?.addEventListener("click", () => panel.remove());
    }

    document.body.appendChild(panel);
    tampilkanDaftar(daftar);

  } catch (error) {
    console.error("Gagal membuka notifikasi:", error);
    alert("Gagal memperbarui notifikasi: " + error.message);
  }
}

async function doLogin(){
  const role=document.getElementById("role").value;
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  if(!username||!password){
    loginPage("Data login wajib diisi");
    document.getElementById("role").value=role;
    changeLoginForm();
    return;

  try{

function filterResidents(){
  const data = Array.isArray(window._residentRows)
    ? window._residentRows
    : [];

  const input = document.getElementById("residentSearch");
  const box = document.getElementById("residentList");
  const count = document.getElementById("residentCount");

  if(!input || !box) return;

  const q = input.value.trim().toLowerCase();

  const filtered = data.filter(w => [
    w.nama_lengkap, w.nama, w.nik, w.no_kk,
    w.no_hp, w.alamat, w.gang, w.status_warga, w.hubungan_keluarga
  ].some(v => String(v || "").toLowerCase().includes(q)));

  if(count){
    count.textContent = `Menampilkan ${filtered.length} dari ${data.length} warga`;
  }

  if(!filtered.length){
    box.innerHTML = "<p class='muted' style='text-align:center;padding:16px'>Warga tidak ditemukan.</p>";
    return;
  }

  box.innerHTML = filtered.map(w => {
    const nama = w.nama_lengkap || w.nama || "Nama belum diisi";
    const status = String(w.status_warga || "").toLowerCase();
    const aktif = status === "aktif";
    const menunggu = status === "menunggu_verifikasi";

    const warnaStatus = aktif
      ? "background:#dcfce7;color:#166534"
      : menunggu
        ? "background:#fef3c7;color:#92400e"
        : "background:#f1f5f9;color:#475569";

    return `
      <div style="
        display:flex;align-items:center;gap:11px;
        padding:11px;margin-bottom:8px;
        border:1px solid #dbe5f2;border-radius:12px;
        background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.04)
      ">
        <div
          style="flex-shrink:0;cursor:pointer"
          onclick='showResidentDetail(${JSON.stringify(w).replace(/'/g,"&#39;")})'>
          ${
            w.foto_url
              ? `<img src="${esc(w.foto_url)}" alt="Foto ${esc(nama)}"
                  style="width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid #dbeafe">`
              : `<div style="width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaf2ff;font-size:25px">👤</div>`
          }
        </div>

        <div style="flex:1;min-width:0">
          <div
            style="font-size:14px;font-weight:700;color:#1e293b;overflow-wrap:anywhere;cursor:pointer"
            onclick='showResidentDetail(${JSON.stringify(w).replace(/'/g,"&#39;")})'>
            ${esc(nama)}
          </div>
          <div style="font-size:12px;color:#64748b;margin-top:3px">
            ${esc(w.hubungan_keluarga || "Hubungan belum diisi")}
          </div>
          <div style="font-size:11px;color:#64748b;margin-top:3px">
            KK: ${esc(w.no_kk ? "•••• " + String(w.no_kk).slice(-4) : "Belum diisi")}
          </div>
          <span style="display:inline-block;margin-top:5px;padding:3px 8px;border-radius:20px;font-size:10px;${warnaStatus}">
            ${esc(w.status_warga || "Status belum diisi")}
          </span>
        </div>

        <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
          <button class="btn secondary"
            style="margin:0;padding:6px 8px;font-size:11px"
            onclick='showResidentDetail(${JSON.stringify(w).replace(/'/g,"&#39;")})'>
            Detail
          </button>
          ${

              ? `<button class="btn" style="margin:0;padding:6px 8px;font-size:11px"
                   onclick="verifyResident(${Number(w.id)})">Verifikasi</button>`
              : aktif
                ? `<button class="btn secondary" style="margin:0;padding:6px 8px;font-size:11px"
                     onclick="deactivateResident(${Number(w.id)})">Nonaktifkan</button>`

  }).join("");

async function muatArsipIdentitas(){
  try{
    const [data,residents]=await Promise.all([api("/api/identitas"),api("/api/residents")]);
    window._identitasFamilies=data.families||[];
    window._identitasDocuments=data.documents||[];
    window._identitasResidents=Array.isArray(residents)?residents:[];
    const select=document.getElementById("identitasFamily");
    if(select){
      select.innerHTML='<option value="">Pilih keluarga...</option>'+window._identitasFamilies.map(f=>
        `<option value="${Number(f.id)}">${esc(f.kepala_keluarga||"Keluarga")} — KK ${esc("•••• "+String(f.no_kk||"").slice(-4))} (RT ${esc(f.rt||"")} / RW ${esc(f.rw||"")})</option>`
      ).join("");
    }
    renderArsipIdentitas();
  }catch(e){
    const box=document.getElementById("identitasDocs");
    if(box)box.innerHTML=`<div class="error">${esc(e.message)}</div>`;
  }
}

function renderArsipIdentitas(){
  const box=document.getElementById("identitasDocs");
  if(!box)return;
  const docs=window._identitasDocuments||[];
  const families=window._identitasFamilies||[];
  const linked=docs.filter(d=>d.warga_id).length;
  const pending=docs.filter(d=>d.status_verifikasi!=="terverifikasi").length;
  const residents=window._identitasResidents||[];
  const nikCounts={};
  residents.forEach(w=>{const n=String(w.nik||"").trim();if(n)nikCounts[n]=(nikCounts[n]||0)+1;});
  const nikIssues=residents.filter(w=>!/^[0-9]{16}$/.test(String(w.nik||""))||(nikCounts[String(w.nik||"").trim()]||0)>1).length;
  box.innerHTML=`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px">
    <div style="background:#eff6ff;border-radius:9px;padding:9px;text-align:center"><b>${families.length}</b><div style="font-size:10px;color:#64748b">Keluarga</div></div>
    <div style="background:#f0fdf4;border-radius:9px;padding:9px;text-align:center"><b>${linked}</b><div style="font-size:10px;color:#64748b">KTP terhubung</div></div>
    <div style="background:#fff7ed;border-radius:9px;padding:9px;text-align:center"><b>${pending}</b><div style="font-size:10px;color:#64748b">Perlu verifikasi</div></div>
    <div style="background:#fef2f2;border-radius:9px;padding:9px;text-align:center"><b>${nikIssues}</b><div style="font-size:10px;color:#64748b">NIK perlu dicek</div></div>
  </div>`+families.map(f=>{
    const list=docs.filter(d=>String(d.keluarga_id)===String(f.id));
    if(!list.length)return "";
    const kk=list.filter(d=>d.jenis_dokumen==="KK");
    const ktp=list.filter(d=>d.jenis_dokumen==="KTP");
    const docCard=d=>{
      const status=d.status_verifikasi==="terverifikasi"?"Terverifikasi":d.status_verifikasi==="perlu_perbaikan"?"Perlu perbaikan":"Menunggu verifikasi";
      const statusColor=d.status_verifikasi==="terverifikasi"?"#dcfce7":d.status_verifikasi==="perlu_perbaikan"?"#fee2e2":"#fef3c7";
      return `<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:7px 0">
        <div style="font-weight:700;font-size:13px">${d.jenis_dokumen==="KK"?"📄 KK":"🪪 KTP"} — ${esc(d.nama_file)}</div>
        <div style="font-size:11px;color:#64748b;margin:4px 0">${Math.max(1,Math.round(Number(d.ukuran_bytes||0)/1024))} KB · <span style="background:${statusColor};padding:2px 6px;border-radius:10px">${status}</span></div>
        ${Array.isArray(d.ocr_data?.nik_candidates)&&d.ocr_data.nik_candidates.length?'<div style="font-size:11px;color:#475569;margin-top:5px">Kandidat NIK: '+d.ocr_data.nik_candidates.map(esc).join(', ')+' · wajib dicocokkan</div>':''}
        ${d.ocr_text?'<details><summary style="font-size:12px;cursor:pointer">Lihat hasil OCR</summary><pre style="white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto">'+esc(d.ocr_text)+'</pre></details>':''}
        ${d.jenis_dokumen==="KTP"&&!d.warga_id?`<details style="margin-top:8px"><summary style="font-size:12px;font-weight:700;cursor:pointer;color:#174a82">＋ Catat sebagai anggota keluarga</summary>
          <div style="padding-top:8px">
            <label>Nama lengkap</label><input id="anggotaNama_${Number(d.id)}" value="${esc(d.ocr_data?.nama_candidate||"")}" maxlength="120">
            <label>NIK (16 digit)</label><input id="anggotaNik_${Number(d.id)}" inputmode="numeric" maxlength="16" value="${esc(d.ocr_data?.nik_candidates?.[0]||"")}">
            <label>Jenis kelamin</label><select id="anggotaJK_${Number(d.id)}"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select>
            <label>Tempat lahir</label><input id="anggotaTempat_${Number(d.id)}">
            <label>Tanggal lahir</label><input id="anggotaTanggal_${Number(d.id)}" type="date">
            <label>Hubungan keluarga</label><select id="anggotaHubungan_${Number(d.id)}"><option value="">Pilih</option><option>Kepala Keluarga</option><option>Istri</option><option>Suami</option><option>Anak</option><option>Orang Tua</option><option>Lainnya</option></select>
            <button class="btn" style="margin:8px 0 0;padding:8px 10px;font-size:12px" onclick="simpanAnggotaDariKtp(${Number(d.id)})">Simpan anggota ke database</button>

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">

          ${d.status_verifikasi!=="terverifikasi"?'<button class="btn secondary" style="margin:0;padding:7px 10px;font-size:12px" onclick="verifikasiDokumenIdentitas('+Number(d.id)+')">✓ Verifikasi</button>':''}
        </div>
      </div>`;
    };
    return `<div style="border:1px solid #dbe5f2;border-radius:12px;padding:11px;margin:10px 0">
      <b>🏠 ${esc(f.kepala_keluarga||"Keluarga")}</b>
      <div class="muted" style="font-size:11px;margin:3px 0 8px">No. KK: •••• ${esc(String(f.no_kk||"").slice(-4))} · ${esc(f.alamat||"")}</div>
      <b style="font-size:12px">Kartu Keluarga (${kk.length})</b>${kk.map(docCard).join("")||'<p class="muted" style="font-size:12px">KK belum diunggah.</p>'}
      <b style="font-size:12px;display:block;margin-top:10px">KTP Anggota (${ktp.length})</b>${ktp.map(docCard).join("")||'<p class="muted" style="font-size:12px">KTP belum diunggah.</p>'}
      <button class="btn secondary" style="width:100%;margin:8px 0 0;font-size:12px" onclick="cetakSalinanDataKeluarga(${Number(f.id)})">📄 Cetak Salinan Data Keluarga</button>
    </div>`;
  }).join("")||(docs.length?'<p class="muted">Tidak ada arsip keluarga.</p>':'<p class="muted">Belum ada dokumen yang diarsipkan.</p>');
}


async function simpanAnggotaDariKtp(id){
  const get=suffix=>document.getElementById(suffix+"_"+id)?.value?.trim()||"";
  const data={
    nama_lengkap:get("anggotaNama"),
    nik:get("anggotaNik"),
    jenis_kelamin:get("anggotaJK"),
    tempat_lahir:get("anggotaTempat"),
    tanggal_lahir:get("anggotaTanggal"),
    hubungan_keluarga:get("anggotaHubungan")
  };
  if(!data.nama_lengkap||!data.nik||!data.jenis_kelamin||!data.hubungan_keluarga){
    alert("Nama, NIK, jenis kelamin, dan hubungan keluarga wajib diisi.");return;
  }
  if(!/^[0-9]{16}$/.test(data.nik)){alert("NIK harus tepat 16 digit.");return;}
  try{
    const result=await api("/api/identitas/"+id+"/anggota",{method:"POST",body:JSON.stringify(data)});
    alert(result.message||"Anggota keluarga tersimpan.");
    await muatArsipIdentitas();
  }catch(e){alert(e.message);}
}

async function buatKeluargaIdentitas(){
  const no_kk=document.getElementById("idNoKk")?.value.trim();
  const kepala_keluarga=document.getElementById("idKepala")?.value.trim();
  const alamat=document.getElementById("idAlamat")?.value.trim();
  const rt=document.getElementById("idRt")?.value.trim()||"004";
  const rw=document.getElementById("idRw")?.value.trim()||"01";
  try{
    const result=await api("/api/identitas/keluarga",{method:"POST",body:JSON.stringify({no_kk,kepala_keluarga,alamat,rt,rw})});
    await muatArsipIdentitas();
    const select=document.getElementById("identitasFamily");
    if(select&&result.family)select.value=String(result.family.id);
    alert(result.message||"Data keluarga berhasil disimpan.");
  }catch(e){alert(e.message);}
}

window._identitasKtpCameraFiles = window._identitasKtpCameraFiles || [];

function tampilkanFotoKamera(jenis,input){
  const file=input?.files?.[0];
  if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert("Gunakan foto JPG, PNG, atau WebP dari kamera.");input.value="";return;}
  if(file.size>8*1024*1024){alert("Ukuran foto maksimal 8 MB.");input.value="";return;}
  const status=document.getElementById("identitasKKStatus");
  if(status)status.textContent="✓ Foto KK siap disimpan: "+file.name;
}

function tambahFotoKtpKamera(input){
  const file=input?.files?.[0];
  if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert("Gunakan foto JPG, PNG, atau WebP dari kamera.");input.value="";return;}
  if(file.size>8*1024*1024){alert("Ukuran foto maksimal 8 MB.");input.value="";return;}
  if(window._identitasKtpCameraFiles.length>=20){alert("Maksimal 20 foto KTP untuk satu keluarga.");input.value="";return;}
  window._identitasKtpCameraFiles.push(file);
  const status=document.getElementById("identitasKTPStatus");
  if(status)status.textContent="✓ "+window._identitasKtpCameraFiles.length+" foto KTP siap disimpan: "+window._identitasKtpCameraFiles.map((f,i)=>(i+1)+". "+f.name).join(" · ");
  input.value="";
}

  const familyId=document.getElementById("identitasFamily")?.value;
  const kk=document.getElementById("identitasKK")?.files?.[0];
  const ktps=Array.from(window._identitasKtpCameraFiles||[]);
  if(!familyId){alert("Pilih atau buat data keluarga terlebih dahulu.");return;}
  if(!kk||!ktps.length){alert("Wajib unggah satu KK dan minimal satu KTP.");return;}
  if(ktps.length>20){alert("Maksimal 20 file KTP dalam satu kali unggah.");return;}
  const all=[kk,...ktps];
  if(all.some(f=>f.size>8*1024*1024)){alert("Setiap file maksimal 8 MB.");return;}
  const btn=document.getElementById("btnUploadIdentitas");
  const progress=document.getElementById("identitasProgress");
  btn.disabled=true;btn.textContent="Mengunggah...";
  let worker=null;
  try{
    const selected=[{file:kk,kind:"KK"},...ktps.map(file=>({file,kind:"KTP"}))];
    for(let i=0;i<selected.length;i++){
      const item=selected[i],file=item.file;
      progress.textContent="Menyiapkan "+item.kind+" "+(i+1)+"/"+selected.length+"...";
      const signed=await api("/api/identitas/upload-url",{method:"POST",body:JSON.stringify({
        keluarga_id:familyId,jenis_dokumen:item.kind,mime_type:file.type,ukuran_bytes:file.size,nama_file:file.name
      })});
      const uploaded=await fetch(signed.upload_url,{method:"PUT",headers:{"Content-Type":file.type,"x-upsert":"false"},body:file});
      if(!uploaded.ok)throw new Error("Gagal mengunggah "+file.name+". Periksa koneksi dan coba lagi.");
      const registered=await api("/api/identitas/register-upload",{method:"POST",body:JSON.stringify({
        keluarga_id:familyId,storage_path:signed.storage_path,jenis_dokumen:item.kind,mime_type:file.type,
        ukuran_bytes:file.size,nama_file:file.name
      })});
      const doc=registered.document;
      if(file.type!=="application/pdf"){
        try{
          if(!worker)worker=await loadTesseractIdentitas();
          progress.textContent="Membaca teks "+item.kind+" "+(i+1)+"/"+selected.length+"...";
          const ocr=await worker.recognize(file);
          const textOcr=String(ocr?.data?.text||"").slice(0,50000);
          await api("/api/identitas/"+doc.id+"/ocr",{method:"PATCH",body:JSON.stringify({ocr_text:textOcr})});
        }catch(ocrError){
          progress.textContent="Dokumen tersimpan; OCR gagal pada "+file.name+". Dokumen tetap dapat dicetak.";
        }
      }
    }
    if(worker){await worker.terminate();worker=null;}
    document.getElementById("identitasKK").value="";
    document.getElementById("identitasKTP").value="";
    window._identitasKtpCameraFiles=[];
    document.getElementById("identitasKKStatus").textContent="Belum ada foto KK.";
    document.getElementById("identitasKTPStatus").textContent="Belum ada foto KTP.";
    await muatArsipIdentitas();
    progress.textContent="Selesai. Dokumen asli tersimpan privat; hasil OCR menunggu pemeriksaan Ketua RT.";
    alert("Dokumen KK dan KTP berhasil diarsipkan. Periksa hasil OCR dan cocokkan dengan dokumen asli sebelum verifikasi.");
  }catch(e){
    progress.textContent="";
    alert(e.message);
  }finally{
    if(worker)await worker.terminate();
    btn.disabled=false;btn.textContent="⬆️ Upload KK dan KTP";
  }
}

async function loadTesseractIdentitas(){
  if(!window.Tesseract){
    await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      script.onload=resolve;script.onerror=()=>reject(new Error("Pustaka OCR tidak dapat dimuat. Periksa koneksi internet."));
      document.head.appendChild(script);
    });
  }
  return window.Tesseract.createWorker("ind+eng",1,{
    langPath:"https://tessdata.projectnaptha.com/4.0.0",
    logger:m=>{if(m.status==="recognizing text")console.log("OCR progress",Math.round((m.progress||0)*100)+"%");}
  });
}

async function jalankanOcrIdentitas(id){
  const input=document.createElement("input");
  input.type="file";input.accept="image/jpeg,image/png,image/webp";input.capture="environment";
  input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    if(file.size>8*1024*1024){alert("Ukuran gambar maksimal 8 MB.");return;}
    let worker;
    try{
      worker=await loadTesseractIdentitas();
      const result=await worker.recognize(file);
      const textOcr=String(result?.data?.text||"").slice(0,50000);
      await api("/api/identitas/"+id+"/ocr",{method:"PATCH",body:JSON.stringify({ocr_text:textOcr})});
      await muatArsipIdentitas();
      alert("OCR selesai. Periksa hasil pembacaan dengan dokumen asli.");
    }catch(e){alert("OCR gagal: "+e.message);}
    finally{if(worker)await worker.terminate();}
  };
  input.click();
}

function filterKeluargaAdmin(){
  const data = Array.isArray(window._keluargaRows)
    ? window._keluargaRows
    : [];
  const input = document.getElementById("keluargaSearch");
  const box = document.getElementById("keluargaList");
  const count = document.getElementById("keluargaCount");

  if(!input || !box) return;

  const q = input.value.trim().toLowerCase();
  const groups = {};

  data.forEach(w => {
    const key = w.keluarga_id
      ? `keluarga-${w.keluarga_id}`
      : w.no_kk
        ? `kk-${String(w.no_kk).trim()}`
        : `warga-${w.id}`;

    if(!groups[key]){
      groups[key] = {
        no_kk: w.no_kk || "",
        alamat: w.alamat || "",
        anggota: []
      };
    }

    groups[key].anggota.push(w);
  });

  const keluarga = Object.values(groups).map(k => {
    k.anggota.sort((a,b) => {
      const rank = w => {
        const h = String(w.hubungan_keluarga || "").trim().toLowerCase();
        if(h === "kepala keluarga") return 0;
        if(h === "istri" || h === "suami") return 1;
        if(h === "anak") return 2;
        return 3;
      };
      return rank(a) - rank(b);
    });

    k.kepala = k.anggota.find(w =>
      String(w.hubungan_keluarga || "").trim().toLowerCase() === "kepala keluarga"
    ) || k.anggota[0];

    return k;
  }).filter(k => {
    const teks = [
      k.kepala.nama_lengkap,
      k.kepala.nama,
      k.no_kk,
      k.alamat,
      ...k.anggota.map(w => w.nama_lengkap || w.nama)
    ].join(" ").toLowerCase();

    return teks.includes(q);
  });

  if(count){
    count.textContent = `${keluarga.length} keluarga`;

  if(!keluarga.length){
    box.innerHTML = "<p class='muted' style='text-align:center;padding:16px'>Keluarga tidak ditemukan.</p>";

  box.innerHTML = keluarga.map((k,index) => {
    const kepala = k.kepala;

    const id = `keluarga-admin-${index}`;
    const noKK = k.no_kk
      ? "•••• " + String(k.no_kk).slice(-4)
      : "Belum diisi";

    return `
      <div style="
        margin-bottom:10px;border:1px solid #dbe5f2;
        border-radius:13px;overflow:hidden;background:#fff;
        box-shadow:0 1px 4px rgba(15,23,42,.05)
      ">
        <button type="button" class="btn secondary"
          onclick="toggleKeluargaCard('${id}',this)"
          style="
            width:100%;margin:0;padding:12px;
            border:0;border-radius:0;text-align:left;
            display:flex;align-items:center;gap:11px;
            background:#eff6ff;color:#17365d
          ">
          ${
            kepala.foto_url
              ? `<img src="${esc(kepala.foto_url)}" alt="Foto kepala keluarga"
                  style="width:64px;height:64px;flex-shrink:0;border-radius:12px;object-fit:cover;border:1px solid #dbeafe">`
              : `<div style="width:64px;height:64px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#dbeafe;font-size:27px">👤</div>`
          }
          <span style="flex:1;min-width:0">
            <b style="font-size:14px;overflow-wrap:anywhere">🏠 Keluarga ${esc(nama)}</b>
            <span style="display:block;font-size:11px;color:#64748b;margin-top:4px">
              No. KK: ${esc(noKK)}
            </span>
            <span style="display:block;font-size:11px;color:#64748b;margin-top:3px">
              ${k.anggota.length} anggota · ${esc(k.alamat || "Alamat belum diisi")}
            </span>
          </span>
          <span style="
            flex-shrink:0;width:25px;height:25px;
            display:flex;align-items:center;justify-content:center;
            border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:16px
          ">＋</span>
        </button>

        <div id="${id}" hidden style="padding:0 12px 8px">
          ${k.anggota.map(w => `
            <div style="
              display:flex;align-items:center;gap:9px;
              padding:9px 0;border-top:1px solid #edf0f5
            ">
              <div style="flex-shrink:0;cursor:pointer"

                }

async function saveResident(event,id){
  event.preventDefault();

  const keys = [
    "nik","no_kk","nama_lengkap",
    "tempat_lahir","tanggal_lahir","alamat","gang","rt","rw",
    "pekerjaan","no_hp","jenis_kelamin",
    "status_perkawinan","status_hunian","hubungan_keluarga"
  ];

  const body = {};

  for(const key of keys){
    const el = document.getElementById("edit_"+key);

    if(el){
      const value = el.value.trim();

      if(el.tagName === "SELECT" && !value){
        continue;
      }

      if(key === "tanggal_lahir"){
        body[key] = value || null;
      }else{
        body[key] = value;
      }
    }
  }

  try{
    const result = await api(`/api/residents/${encodeURIComponent(id)}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    if(result && result.ok === false){
      throw new Error(result.message || "Gagal menyimpan data");
    }

    alert("Data warga berhasil diperbarui.");
    residents();
  }catch(error){
    alert("Gagal menyimpan data: "+error.message);
  }
}

async function transparansiQRIS(tombolReload) {
  if (tombolReload) { tombolReload.disabled = true; tombolReload.textContent = "Memuat ulang..."; }
  let modeInfo = { mode: "sandbox", configured: false };

    <div style="padding:16px;background:#f8fafc;border-radius:14px;color:#475569">
      Memuat riwayat transaksi QRIS...
    </div>`;

  let catatan = "";

  const formatWaktu = nilai => {
    if (!nilai) return "Belum tersedia";

    const tanggal = new Date(nilai);

    return Number.isNaN(tanggal.getTime())
      ? "Format waktu tidak valid"
      : tanggal.toLocaleString("id-ID", {
          dateStyle: "medium",

    if (!hasil || hasil.ok !== true) {
      throw new Error("Riwayat transaksi belum dapat dimuat.");
    }

    const transaksi = Array.isArray(hasil.data) ? hasil.data : [];

    isiTransaksi = transaksi.length
      ? transaksi.map(item => {
          const lunas = item.status === "lunas";
          const status = lunas ? "Lunas" : "Menunggu pembayaran";
          const rincian = Array.isArray(item.rincian) ? item.rincian : [];

/* SALIN BUKTI TRANSAKSI QRIS */
async function salinBuktiQRIS(tombol) {
  const data = {
    order_id: tombol.dataset.order || "",
    transaction_id: tombol.dataset.transaction || "",
    status_midtrans: tombol.dataset.status || "",
    total: Number(tombol.dataset.total) || 0,
    bulan: (tombol.dataset.bulan || "").split(", ").filter(Boolean),
    waktu_settlement: tombol.dataset.settlement || "",
    waktu_notifikasi: tombol.dataset.notifikasi || ""
  };

  const teks = [
    "BUKTI TRANSAKSI QRIS - RT TBK",
    "Order ID: " + (data.order_id || "-"),
    "Transaction ID: " + (data.transaction_id || "-"),
    "Status Midtrans: " + (data.status_midtrans || "-"),
    "Total pembayaran: " +
      (typeof rupiah === "function" ? rupiah(data.total) : String(data.total)),
    "Bulan iuran: " + (data.bulan.join(", ") || "-"),
    "Waktu settlement: " + (data.waktu_settlement || "-"),
    "Waktu notifikasi: " + (data.waktu_notifikasi || "-"),
    "",
    "Catatan: Status settlement bukan bukti pencairan dana."
  ].join("\n");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(teks);
    } else {
      const area = document.createElement("textarea");
      area.value = teks;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();

      const berhasil = document.execCommand("copy");
      area.remove();

      if (!berhasil) {
        throw new Error("Penyalinan tidak berhasil.");
      }
    }

    alert("Bukti transaksi berhasil disalin.");
  } catch (error) {
    console.error("Gagal menyalin bukti QRIS:", error);
    alert("Tidak dapat menyalin bukti. Silakan coba melalui browser yang mendukung clipboard.");
  }
}

function getCashCategory(x){
  const kategori = String(x.kategori || "").trim();
  const keterangan =
    String(x.description || x.keterangan || "").toLowerCase();

  // Kategori yang sudah dipilih saat pencatatan selalu dipakai.
  // Tebakan dari keterangan hanya untuk data lama tanpa kategori spesifik.
  if(
    kategori &&
    !["Iuran Warga","Pemasukan Lainnya","Pengeluaran","Lainnya"].includes(kategori)
  ){
    return kategori;
  }

  if(keterangan.includes("keamanan")){
    return "Keamanan";
  }

  if(keterangan.includes("sampah")){
    return "Sampah";
  }

  if(keterangan.includes("kas rt")){
    return "Kas RT";
  }

  if(kategori){
    return kategori;
  }

  if(keterangan.includes("kegiatan")){
    return "Kegiatan RT";
  }

  if(
    keterangan.includes("sarana") ||
    keterangan.includes("prasarana")
  ){
    return "Sarana/Prasarana";
  }

  return x.type === "masuk"
    ? "Pemasukan Lainnya"
    : "Pengeluaran";
}

function filterCashAdmin(){
  const rows = Array.isArray(window._cashAdminRows)
    ? window._cashAdminRows
    : [];

  const type =
    document.getElementById("cashTypeFilter")?.value || "";

  const category =
    document.getElementById("cashCategoryFilter")?.value || "";

  const filtered = rows.filter(x=>{
    if(type && x.type !== type){
      return false;
    }

    const kat = getCashCategory(x);

    if(category && kat !== category){
      return false;
    }

    return true;
  });

  renderCashAdmin(filtered);
}

// Perkecil foto bukti (maks. 1600px, JPEG) agar selalu di bawah batas upload server.
async function kompresFotoBukti(fileAsli){
  if (!fileAsli) throw new Error("Bukti pengeluaran wajib dilampirkan.");
  if (fileAsli.size > 25 * 1024 * 1024) {
    throw new Error("Ukuran foto terlalu besar (maks. 25 MB).");
  }

  const url = URL.createObjectURL(fileAsli);
  try {
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error("Format foto tidak didukung. Gunakan foto JPG atau PNG."));
      el.src = url;
    });

    const MAKS = 1600;
    const skala = Math.min(1, MAKS / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * skala));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * skala));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let kualitas = 0.82;
    let blob = null;
    for (let i = 0; i < 5; i++) {
      blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", kualitas));
      if (blob && blob.size <= 3 * 1024 * 1024) break;
      kualitas -= 0.15;
    }

    if (!blob || blob.size > 4 * 1024 * 1024) {
      throw new Error("Foto bukti terlalu besar. Coba foto ulang dengan resolusi lebih kecil.");
    }

    return new File([blob], "bukti.jpg", { type: "image/jpeg" });
  } finally {
    URL.revokeObjectURL(url);
  }
}

let cashSaving = false;


async function saveCash(){
  if (cashSaving) return;

  const tombolSimpan = document.getElementById("cashSaveBtn");
  if (!tombolSimpan) return;

  cashSaving = true;
  tombolSimpan.disabled = true;
  tombolSimpan.textContent = "Menyimpan...";

  let transaksiBerhasil = false;

  try {
    const type = document.getElementById("cashType").value;
    const category = document.getElementById("cashCategory").value;
    const date = document.getElementById("cashDate").value;
    const description = document.getElementById("cashDesc").value.trim();
    const amount = document.getElementById("cashAmount").value;
    const proofInput = document.getElementById("cashProof");

    if (
      !category ||
      !date ||
      !description ||
      !amount ||
      !Number.isFinite(Number(amount)) ||
      Number(amount) <= 0
    ) {
      alert("Lengkapi kategori, tanggal, keterangan, dan jumlah.");
      return;
    }

    let proofPath = null;

    if (type === "keluar") {
      if (!proofInput || !proofInput.files.length) {
        alert("Bukti pengeluaran wajib dilampirkan.");
        return;
      }

      tombolSimpan.textContent = "Menyiapkan foto...";

      let file;
      try {
        file = await kompresFotoBukti(proofInput.files[0]);
      } catch (err) {
        alert(err.message || "Foto bukti tidak dapat dibaca. Coba foto ulang atau pilih file JPG/PNG.");
        return;
      }

      tombolSimpan.textContent = "Mengunggah bukti...";

      const uploadResponse = await fetch("/api/cash/proof", {
        method: "POST",
        headers: {
          "Content-Type": file.type
        },
        body: file
      });

      let uploadResult = {};
      try {
        uploadResult = await uploadResponse.json();
      } catch (_) {
        uploadResult = {
          ok: false,
          message: uploadResponse.status === 413
            ? "Foto bukti terlalu besar untuk diunggah."
            : "Gagal mengunggah bukti (HTTP " + uploadResponse.status + ")."
        };
      }

      if (
        !uploadResponse.ok ||
        !uploadResult.ok ||
        !uploadResult.path
      ) {
        throw new Error(
          uploadResult.message || "Gagal mengunggah bukti."
        );
      }

      proofPath = uploadResult.path;
    }

    tombolSimpan.textContent = "Menyimpan transaksi...";

    await api("/api/cash", {
      method: "POST",
      body: JSON.stringify({
        type,
        category,
        date,
        description,
        amount,
        proof: proofPath
      })
    });

    transaksiBerhasil = true;

    alert("Transaksi berhasil disimpan.");
    await cash();

  } catch (e) {
    alert(
      e.message ||
      "Hasil penyimpanan belum dapat dipastikan. Periksa riwayat kas sebelum mencoba lagi."
    );
  } finally {
    cashSaving = false;

    // Pulihkan tombol hanya jika formulir masih ditampilkan.
    const tombolSaatIni = document.getElementById("cashSaveBtn");

    if (tombolSaatIni && !transaksiBerhasil) {
      tombolSaatIni.disabled = false;
      tombolSaatIni.textContent = "Simpan transaksi";
    }
  }
}

async function processLetter(id, status){
  const catatan = status === "ditolak"
    ? prompt("Alasan penolakan surat:")
    : prompt("Catatan Ketua RT (boleh dikosongkan):");

  if(catatan === null) return;

  if(status === "ditolak" && !catatan.trim()){
    alert("Mohon isi alasan penolakan.");
    return;
  }

  if(!confirm(
    status === "disetujui"
      ? "Setujui pengajuan surat ini?"
      : "Tolak pengajuan surat ini?"
  )) return;

  try{
    const result = await api("/api/letters/" + id, {
      method: "PATCH",
      body: JSON.stringify({ status, catatan })
    });

    if(result && result.ok){
      alert(result.message || "Status surat berhasil diperbarui.");
      await letters();
    }else{
      alert(result?.message || "Gagal memproses surat.");
    }
  }catch(e){
    alert(e.message || "Gagal memproses surat.");
  }
}

      sekarang.getFullYear(),
      sekarang.getMonth(),
      1
    );

    // Mulai dari bulan tertua yang belum lunas (sejak awal pencatatan
    // Oktober 2026), supaya tunggakan bulan sebelumnya tetap bisa dipilih.
    const awalPencatatan = new Date(2026, 9, 1);
    const kunciBulan = d =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
    let awal = new Date(bulanIni);
    for (
      let d = new Date(awalPencatatan);
      d < bulanIni;
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1)
    ) {
      const rec = rows.find(x => String(x.bulan).slice(0, 10) === kunciBulan(d));
      if (!rec || rec.status !== "lunas") {
        awal = new Date(d);
        break;
      }

    if (awal < awalPencatatan) awal = new Date(awalPencatatan);

    // Tampilkan tepat 12 bulan, dimulai dari bulan tertua yang belum lunas.

async function uploadFotoProfil(){
  const input = document.getElementById("fotoProfilInput");
  const file = input?.files?.[0];

  if (!file) return;

  const tipeDiizinkan = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!tipeDiizinkan.includes(file.type)) {
    alert("Foto harus berformat JPG, PNG, atau WebP.");
    input.value = "";
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    alert("Ukuran foto maksimal 2 MB.");
    input.value = "";
    return;
  }

  const formData = new FormData();
  formData.append("foto", file);

  try {
    const hasil = await api("/api/my-photo", {
      method: "POST",
      body: formData
    });

    if (hasil && hasil.ok) {
      alert("Foto profil berhasil diperbarui.");
      await myData();
    } else {
      throw new Error(
        hasil?.message || "Foto gagal diunggah."
      );
    }
  } catch (error) {
    alert(error.message || "Gagal mengunggah foto.");
  } finally {
    input.value = "";
  }
}

          style="width:100%;margin-top:12px"
          onclick="downloadMyLetterPDF(${Number(x.id)})">
          ↓ Unduh PDF Surat
        </button>
      ` : ""}

      <button class="btn secondary"
        style="width:100%;margin-top:16px"
        onclick="myLetters()">
       ← Kembali
      </button>
    </div>
  `);
}

function downloadMyLetterPDF(id){
  if (!Number.isInteger(id) || id <= 0) {
    alert("ID surat tidak valid.");
    return;
  }

  // Gunakan endpoint HTTPS satu-domain secara langsung.
  // Jangan membuat blob: URL karena Android WebView menganggapnya
  // bukan domain aplikasi dan memblokir unduhan demi keamanan.
  window.location.href =
    "/api/my-letters/" + encodeURIComponent(id) + "/pdf";
}

function newComplaint(){
  layout("Pengaduan Warga",`
    <div class="card">
      <label>Judul pengaduan</label>
      <input id="complaintTitle" placeholder="Contoh: Lampu jalan mati">

      <label>Isi pengaduan</label>
      <textarea id="complaintContent"
        placeholder="Jelaskan pengaduan Anda"></textarea>

      <button class="btn" style="margin-top:16px" onclick="saveComplaint()">
        Kirim pengaduan
      </button>

      <button class="btn secondary" style="margin-top:8px" onclick="wargaHome()">
        Kembali
      </button>
    </div>
  `);
}

async function saveComplaint(){
  try{
    await api("/api/complaints",{
      method:"POST",
      body:JSON.stringify({
        title:document.getElementById("complaintTitle").value.trim(),
        content:document.getElementById("complaintContent").value.trim()
      })
    });

    alert("Pengaduan berhasil dikirim");
    await myComplaints();
  }catch(e){
    alert(e.message);
  }
}

async function myComplaints(){
  layout("Riwayat Pengaduan",`
    <div class="card" id="myComplaintList">Memuat riwayat pengaduan...</div>
    <button class="btn secondary" style="width:100%;margin-top:12px" onclick="newComplaint()">Buat Pengaduan</button>
    <button class="btn secondary" style="width:100%;margin-top:8px" onclick="wargaHome()">Kembali</button>
  `);
  try{
    const data = await api("/api/my-complaints");
    const box = document.getElementById("myComplaintList");
    if(!Array.isArray(data) || data.length === 0){
      box.innerHTML = "<p class='muted'>Anda belum mengirim pengaduan.</p>";
      return;
    }
    box.innerHTML = data.map(item => `
      <div class="row" style="padding:14px 0;border-bottom:1px solid #e2e8f0">
        <b>${esc(item.title || "Pengaduan")}</b>
        <div style="margin-top:6px;white-space:pre-wrap">${esc(item.content || "")}</div>
        <div class="muted" style="margin-top:8px;font-size:12px">
          Dikirim: ${item.created_at ? esc(new Date(item.created_at).toLocaleString("id-ID")) : "-"}
        </div>
        <span class="badge" style="display:inline-block;margin-top:8px">
          ${item.sudah_dibaca ? "Sudah dibaca Ketua RT" : "Menunggu dibaca Ketua RT"}
        </span>
      </div>
    `).join("");
  }catch(error){
    const box = document.getElementById("myComplaintList");
    if(box) box.innerHTML = `<div class="error">${esc(error.message || "Riwayat pengaduan gagal dimuat.")}</div>`;
  }
}

async function announcementsWarga(){
  layout("Pengumuman RT",`
    <div class="card" id="wargaAnnouncementList">Memuat...</div>
    <button class="btn secondary" onclick="wargaHome()">Kembali</button>
  `);

  try{
    const data=await api("/api/announcements");
    const box=document.getElementById("wargaAnnouncementList");

    if(!data.length){
      box.innerHTML="<p class='muted'>Belum ada pengumuman</p>";
      return;
    }

    box.innerHTML=data.map(x=>`
      <div class="row">
        <b>${esc(x.title||x.judul)}</b>
        <div>${esc(x.content||x.isi)}</div>
      </div>
    `).join("");
  }catch(e){
    document.getElementById("wargaAnnouncementList").innerHTML=
      `<div class="error">${esc(e.message)}</div>`;
  }
}

/* ASPIRASI WARGA */
function aspirasiWarga(){
  layout("Aspirasi Warga",`
    <div class="card">
      <p class="muted">Sampaikan kebutuhan lingkungan. Ukuran teknis boleh dikosongkan jika belum diketahui; pengurus RT dapat melakukan survei.</p>
      <label>Judul aspirasi</label><input id="aspJudul" placeholder="Contoh: Perbaikan saluran air">
      <label>Kategori</label>
      <select id="aspKategori" required onchange="ubahKategoriAspirasi()">
        <option value="">-- Pilih jenis aspirasi --</option><option value="Perbaikan Jalan (Hotmix)">Perbaikan jalan — Aspal Hotmix</option><option value="Perbaikan Jalan (Paving Block)">Perbaikan jalan — Paving Block</option><option value="Perbaikan Jalan (Beton)">Perbaikan jalan — Beton</option><option value="Drainase / Got">Drainase / Got</option><option value="Penerangan Jalan">Penerangan jalan</option><option value="Kebersihan Lingkungan">Kebersihan lingkungan</option><option value="Keamanan Lingkungan">Keamanan lingkungan</option><option value="Fasilitas Umum">Fasilitas umum</option><option value="Lainnya">Lainnya</option>
      </select><div id="aspJenisInfo" class="muted" style="font-size:13px;margin-top:8px">Pilih jenis aspirasi agar proposal dan RAB menyesuaikan.</div>
      <label>Tingkat urgensi</label>
      <select id="aspUrgensi"><option>Reguler</option><option>Prioritas</option><option>Urgent</option></select>
      <label>Lokasi lengkap</label><input id="aspLokasi" placeholder="Contoh: depan rumah nomor ... / gang ...">
      <label>Uraian kondisi / masalah</label><textarea id="aspUraian" placeholder="Jelaskan masalah dan dampaknya bagi warga"></textarea>
      <h3>Ukuran kondisi saat ini (meter)</h3>
      <div class="grid"><div><label>Panjang</label><input id="aspKP" type="number" min="0" step=".01"></div><div><label>Lebar</label><input id="aspKL" type="number" min="0" step=".01"></div><div><label>Tinggi / kedalaman</label><input id="aspKT" type="number" min="0" step=".01"></div></div>
      <h3>Ukuran yang diusulkan (meter)</h3>
      <div class="grid"><div><label>Panjang</label><input id="aspUP" type="number" min="0" step=".01"></div><div><label>Lebar</label><input id="aspUL" type="number" min="0" step=".01"></div><div><label>Tinggi / kedalaman</label><input id="aspUT" type="number" min="0" step=".01"></div></div>
     <label>Solusi yang diharapkan</label>
<textarea id="aspSolusi" placeholder="Contoh: memperbesar saluran dan memperbaiki kemiringan aliran"></textarea>

<h3>Dokumentasi Lapangan</h3>
<p class="muted">Foto membantu pengurus RT dan pihak kelurahan memahami kondisi sebenarnya.</p>

<label>Foto kondisi awal</label>
<input id="aspFotoKondisi" type="file" accept="image/jpeg,image/png">
<small class="muted">Foto lokasi sebelum perbaikan, maksimal 2 MB.</small>

<label>Foto pengukuran lapangan</label>
<input id="aspFotoPengukuran" type="file" accept="image/jpeg,image/png">
<small class="muted">Foto saat mengukur panjang, lebar, atau kedalaman, maksimal 2 MB.</small>
      <button class="btn" style="width:100%;margin-top:14px" onclick="simpanAspirasi()">Kirim Aspirasi</button>
    </div>
    <div class="card"><h3>Riwayat Aspirasi Saya</h3><div id="aspRiwayat">Memuat...</div></div>
  `);
  muatAspirasiWarga();
}
function ubahKategoriAspirasi(){
  const kategori=document.getElementById("aspKategori")?.value||"";
  const judul=document.getElementById("aspJudul");
  const info=document.getElementById("aspJenisInfo");
  if(!kategori){if(info)info.textContent="Pilih jenis aspirasi agar proposal dan RAB menyesuaikan.";return;}
  const cfg=window.AspirasiRab?.infoKategoriAspirasi(kategori);
  if(!cfg)return;
  if(judul&&(!judul.value.trim()||judul.dataset.autoGenerated==="true")){judul.value=cfg.judul;judul.dataset.autoGenerated="true";}
  if(judul&&!judul.dataset.listenerAdded){judul.addEventListener("input",()=>{judul.dataset.autoGenerated="false";});judul.dataset.listenerAdded="true";}
  if(info)info.textContent="Proposal dan RAB disiapkan untuk: "+cfg.label+". Volume hanya dihitung bila ukuran tersedia; harga satuan dilengkapi setelah survei dan cek harga setempat.";
}
let aspirasiSedangDikirim = false;

async function simpanAspirasi(){
  if (aspirasiSedangDikirim) return;
  aspirasiSedangDikirim = true;
  const tombolKirim = document.querySelector('button[onclick="simpanAspirasi()"]');
  if (tombolKirim) {
    tombolKirim.disabled = true;
    tombolKirim.dataset.teksAwal = tombolKirim.textContent;
    tombolKirim.textContent = "Mengirim aspirasi...";
    tombolKirim.style.opacity = ".65";
    tombolKirim.style.cursor = "wait";
  }
  const val=id=>document.getElementById(id)?.value?.trim()||"";

  try{
    const hasil=await api("/api/aspirasi",{
      method:"POST",
      body:JSON.stringify({
        judul:val("aspJudul"),
        kategori:val("aspKategori"),
        urgensi:val("aspUrgensi"),
        lokasi:val("aspLokasi"),
        uraian:val("aspUraian"),
        kondisi_panjang:val("aspKP"),
        kondisi_lebar:val("aspKL"),
        kondisi_tinggi:val("aspKT"),
        usulan_panjang:val("aspUP"),
        usulan_lebar:val("aspUL"),
        usulan_tinggi:val("aspUT"),
        solusi_usulan:val("aspSolusi")
      })
    });

    const id=hasil?.data?.id || hasil?.id;
    if(!id) throw new Error("Aspirasi tersimpan, tetapi ID tidak ditemukan.");

    const fotoKondisi=document.getElementById("aspFotoKondisi")?.files?.[0];
    const fotoPengukuran=document.getElementById("aspFotoPengukuran")?.files?.[0];

    if(fotoKondisi || fotoPengukuran){
      const form=new FormData();
      if(fotoKondisi) form.append("foto_kondisi",fotoKondisi);
      if(fotoPengukuran) form.append("foto_pengukuran",fotoPengukuran);

      await api(`/api/aspirasi/${encodeURIComponent(id)}/dokumentasi`,{
        method:"POST",
        body:form
      });
    }

    alert("Aspirasi berhasil dikirim.");
    aspirasiWarga();
  }catch(e){
    alert(e.message);
  }finally{
    aspirasiSedangDikirim = false;
    if (tombolKirim && tombolKirim.isConnected) {
      tombolKirim.disabled = false;
      tombolKirim.textContent = tombolKirim.dataset.teksAwal || "Kirim Aspirasi";
      tombolKirim.style.opacity = "";
      tombolKirim.style.cursor = "";
    }
  }
}
async function muatAspirasiWarga(){
  const box=document.getElementById("aspRiwayat"); if(!box)return;
  try{
    const rows=await api("/api/aspirasi");
    box.innerHTML=rows.length?rows.map(a=>`<div class="row"><b>${esc(a.judul)}</b><div>${esc(a.kategori)} · ${esc(a.urgensi)}</div><div>${esc(a.lokasi)}</div><span class="badge">${esc(a.status)}</span>${a.catatan?`<p class="muted">Catatan RT: ${esc(a.catatan)}</p>`:""}</div>`).join(""):"<p class='muted'>Belum ada aspirasi.</p>";
  }catch(e){box.innerHTML=`<div class="error">${esc(e.message)}</div>`;}
}
async function aspirasiAdmin(){
  layout("Pengelolaan Aspirasi",`<div class="card" id="aspAdminList">Memuat...</div>`);
  try{
    const rows=await api("/api/aspirasi"), box=document.getElementById("aspAdminList");
    if(!rows.length){box.innerHTML="<p class='muted'>Belum ada aspirasi warga.</p>";return;}
    box.innerHTML=rows.map(a=>`<div class="row">
      <b>${esc(a.judul)}</b><div>Pengusul: ${esc(a.nama_warga||"Warga")}</div>
      <div>${esc(a.kategori)} · <b>${esc(a.urgensi)}</b></div><div>Lokasi: ${esc(a.lokasi)}</div>
      <p>${esc(a.uraian)}</p>
      <div class="muted">Ukuran saat ini: ${esc(a.dimensi?.kondisi_panjang||"-")} × ${esc(a.dimensi?.kondisi_lebar||"-")} × ${esc(a.dimensi?.kondisi_tinggi||"-")} m</div>
      <div class="muted">Ukuran usulan: ${esc(a.dimensi?.usulan_panjang||"-")} × ${esc(a.dimensi?.usulan_lebar||"-")} × ${esc(a.dimensi?.usulan_tinggi||"-")} m</div>
      <span class="badge">${esc(a.status)}</span>
      <label>Status</label><select id="aspStatus_${esc(a.id)}">${["Diajukan","Verifikasi RT","Perlu revisi","Disetujui RT","Diteruskan ke kelurahan","Dalam pengerjaan","Selesai","Ditunda","Ditolak"].map(x=>`<option ${a.status===x?"selected":""}>${x}</option>`).join("")}</select>
      <label>Catatan / hasil survei</label><textarea id="aspCat_${esc(a.id)}">${esc(a.catatan||"")}</textarea>
      <label>Rencana kerja</label><textarea id="aspRencana_${esc(a.id)}">${esc(a.rencana_kerja||"")}</textarea>
      <h4>RAB sesuai jenis aspirasi</h4><p class="muted">Item otomatis mengikuti kategori. Volume mengikuti ukuran yang diisi; harga satuan wajib dilengkapi setelah survei.</p>
      <div id="aspRab_${esc(a.id)}">${(Array.isArray(a.rab)&&a.rab.length?a.rab:(window.AspirasiRab?.buatTemplateRab(a.kategori,a.dimensi)||[])).map((x,i)=>`<div class="row"><input data-rab="${i}" data-field="item" placeholder="Nama pekerjaan/material" value="${esc(x.item)}"><input data-rab="${i}" data-field="spesifikasi" placeholder="Spesifikasi" value="${esc(x.spesifikasi)}"><input data-rab="${i}" data-field="tujuan" placeholder="Kegunaan" value="${esc(x.tujuan)}"><div class="grid"><input data-rab="${i}" data-field="volume" type="number" step=".01" placeholder="Volume" value="${esc(x.volume)}"><input data-rab="${i}" data-field="satuan" placeholder="Satuan" value="${esc(x.satuan)}"><input data-rab="${i}" data-field="harga_satuan" type="number" placeholder="Harga satuan" value="${esc(x.harga_satuan)}"></div></div>`).join("")}</div>
      <button class="btn secondary" onclick="tambahBarisRab('${esc(a.id)}')">+ Tambah item RAB</button>
      <button class="btn" onclick="simpanAspirasiAdmin('${esc(a.id)}')" style="margin-top:8px">Simpan perubahan</button>
      <button class="btn secondary" onclick="window.open('/api/aspirasi/${encodeURIComponent(a.id)}/pdf','_blank')" style="margin-top:8px">Cetak Proposal + RAB PDF</button>
    </div>`).join("");
  }catch(e){document.getElementById("aspAdminList").innerHTML=`<div class="error">${esc(e.message)}</div>`;}
}
function tambahBarisRab(id){
  const box=document.getElementById("aspRab_"+id); if(!box)return;
  const n=box.querySelectorAll("[data-rab]").length/3;
  box.insertAdjacentHTML("beforeend",`<div class="row"><input data-rab="${n}" data-field="item" placeholder="Nama pekerjaan/material"><input data-rab="${n}" data-field="spesifikasi" placeholder="Spesifikasi"><input data-rab="${n}" data-field="tujuan" placeholder="Kegunaan"><div class="grid"><input data-rab="${n}" data-field="volume" type="number" step=".01" placeholder="Volume"><input data-rab="${n}" data-field="satuan" placeholder="Satuan"><input data-rab="${n}" data-field="harga_satuan" type="number" placeholder="Harga satuan"></div></div>`);
}
async function simpanAspirasiAdmin(id){
  const val=s=>document.getElementById(s)?.value||"";
  const box=document.getElementById("aspRab_"+id), grouped={};
  box?.querySelectorAll("[data-rab]").forEach(el=>{const i=el.dataset.rab;grouped[i]=grouped[i]||{};grouped[i][el.dataset.field]=el.value;});
  const rab=Object.values(grouped).filter(x=>x.item||x.spesifikasi||x.volume);
  try{
    await api("/api/aspirasi/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({
      status:val("aspStatus_"+id),catatan:val("aspCat_"+id),rencana_kerja:val("aspRencana_"+id),rab
    })});
    alert("Perubahan aspirasi tersimpan."); aspirasiAdmin();
  }catch(e){alert(e.message);}
}
