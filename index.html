<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1267c9">
<link rel="manifest" href="/manifest.webmanifest">
<title>RT Kita</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #00000010}
h1,h2,h3{margin-top:0}
.logo{text-align:center;margin:35px 0 20px}
.logo h1{color:#1267c9;margin-bottom:5px}
.muted{color:#687386}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 16px;background:#1267c9;color:white;font-weight:700}
.btn.secondary{background:#e8eef7;color:#174a82}
.btn.danger{background:#c62828}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:16px;border-radius:14px;background:#eef5ff}
.stat b{display:block;font-size:25px;color:#1267c9}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{padding:15px;border:1px solid #dbe3ee;border-radius:12px;background:white;text-align:left;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.hidden{display:none!important}
.row{padding:13px 0;border-bottom:1px solid #e8edf3}
.row:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f1ff;color:#1267c9;font-size:12px;font-weight:700}
.bottom{position:sticky;bottom:0;background:white;border-top:1px solid #ddd;padding:9px;display:flex;justify-content:space-around;margin:20px -16px -16px}
.bottom button{border:0;background:transparent;font-size:12px}
.error{background:#ffebee;color:#b71c1c;padding:10px;border-radius:10px;margin-bottom:12px}
.success{background:#e8f5e9;color:#176b20;padding:10px;border-radius:10px;margin-bottom:12px}
</style>
</head>

<body>
<div id="app"></div>

<script>
let currentUser=null;

async function api(url,options={}){
  const res=await fetch(url,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    },
    ...options
  });

  const text=await res.text();
  let data=null;

  try{data=text?JSON.parse(text):null}
  catch{data={message:text}}

  if(!res.ok){
    throw new Error(data?.message||data?.error||"Terjadi kesalahan");
  }

  return data;
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function rupiah(value){
  return "Rp "+Number(value||0).toLocaleString("id-ID");
}

function layout(title,body,showBack=true){
  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="top">
        <div>
          <b style="color:#1267c9">RT Kita</b>
          <div class="muted">${esc(title)}</div>
        </div>
        <button class="btn secondary" onclick="logout()">Keluar</button>
      </div>

      ${body}

      ${showBack ? `
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn secondary" onclick="dashboard()">
      ← Kembali ke Dashboard
    </button>
  </div>
` : ""}
    </div>`;
}

function dashboard(){
  boot();
}

function loginPage(error=""){
  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="logo">
        <h1>RT Kita</h1>
        <div class="muted">Pelayanan warga digital</div>
      </div>

      <div class="card">
        <h2>Masuk</h2>

        ${error?`<div class="error">${esc(error)}</div>`:""}

        <label>Masuk sebagai</label>
        <select id="role" onchange="changeLoginForm()">
          <option value="admin">Ketua RT</option>
          <option value="warga">Warga</option>
        </select>

        <div id="loginFields"></div>

        <button class="btn" style="width:100%;margin-top:16px"
          onclick="doLogin()">Masuk aplikasi</button>
      </div>
    </div>`;

  changeLoginForm();
}

function changeLoginForm(){
  const role=document.getElementById("role")?.value;
  const box=document.getElementById("loginFields");
  if(!box)return;

if(role==="warga"){
  box.innerHTML=`
    <label>Nomor HP</label>
    <input id="username" inputmode="tel" placeholder="Masukkan nomor HP">

    <label>Password</label>
    <input id="password" type="password" placeholder="Masukkan password">

    <button
      class="btn secondary"
      style="width:100%;margin-top:12px"
      onclick="registerWarga()"
    >
      📝 Daftar sebagai Warga
    </button>
  `;

  }else{
    box.innerHTML=`
      <label>Username</label>
      <input id="username" value="admin" autocomplete="username">

      <label>Password</label>
      <input id="password" type="password" placeholder="Password">
    `;
  }
}

  function registerWarga(){
  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="logo">
        <h1>RT Kita</h1>
        <div class="muted">RT 04 / RW 01 · Taman Bali Kahuripan</div>
      </div>

      <div class="card">
        <h2>📝 Daftar sebagai Warga</h2>

        <label>Nama Lengkap</label>
        <input id="regNama" placeholder="Masukkan nama lengkap">

        <label>NIK</label>
        <input id="regNik" inputmode="numeric" placeholder="Masukkan NIK">

        <label>No. KK</label>
        <input id="regKk" inputmode="numeric" placeholder="Masukkan No. KK">

        <label>Nomor HP</label>
        <input id="regHp" inputmode="tel" placeholder="Masukkan nomor HP">

        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Buat password">

        <label>Alamat</label>
        <textarea id="regAlamat" placeholder="Masukkan alamat tempat tinggal"></textarea>

        <button class="btn" style="width:100%;margin-top:16px"
          onclick="submitRegisterWarga()">
          Daftar Warga
        </button>

        <button class="btn secondary" style="width:100%;margin-top:10px"
          onclick="loginPage()">
          Kembali ke Login
        </button>
      </div>
    </div>`;
}

  async function submitRegisterWarga(){
  const nama_lengkap=document.getElementById("regNama").value.trim();
  const nik=document.getElementById("regNik").value.trim();
  const no_kk=document.getElementById("regKk").value.trim();
  const no_hp=document.getElementById("regHp").value.trim();
  const password=document.getElementById("regPassword").value.trim();
  const alamat=document.getElementById("regAlamat").value.trim();

  if(!nama_lengkap || !nik || !no_kk || !no_hp || !password || !alamat){
    alert("Semua data wajib diisi");
    return;
  }

  try{
    const data=await api("/api/register-warga",{
      method:"POST",
      body:JSON.stringify({
        nama_lengkap,
        nik,
        no_kk,
        no_hp,
        password,
        alamat
      })
    });

    alert("Pendaftaran berhasil. Silakan masuk menggunakan nomor HP dan password.");

    loginPage();
    document.getElementById("role").value="warga";
    changeLoginForm();

  }catch(e){
    alert(e.message || "Pendaftaran gagal");
  }
}
async function doLogin(){
  const role=document.getElementById("role").value;
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!username||!password){
    loginPage("Data login wajib diisi");
    document.getElementById("role").value=role;
    changeLoginForm();
    return;
  }

  try{
    const data=await api("/api/login",{
      method:"POST",
      body:JSON.stringify({username,password,role})
    });

    currentUser=data.user;

    if(currentUser.role==="warga"){
      wargaHome();
    }else{
      adminHome();
    }
  }catch(e){
    loginPage(e.message);
    document.getElementById("role").value=role;
    changeLoginForm();
  }
}

async function boot(){
  try{
    const data=await api("/api/me");
    currentUser=data.user;

    if(currentUser.role==="warga") wargaHome();
    else adminHome();
  }catch{
    loginPage();
  }
}

async function logout(){
  try{await api("/api/logout",{method:"POST"})}catch{}
  currentUser=null;
  loginPage();
}

  layout("Dashboard Ketua RT",`
    <div class="card">
      <h2>Selamat datang, Ketua RT</h2>
      <p class="muted">Kelola data dan pelayanan warga dari sini.</p>
    </div>

    <div id="stats" class="grid">
      <div class="stat"><span>Warga aktif</span><b>...</b></div>
      <div class="stat"><span>Surat diajukan</span><b>...</b></div>
      <div class="stat"><span>Pengaduan baru</span><b>...</b></div>

        <button onclick="announcements()">📣 Pengumuman</button>
        <button onclick="iuranAdmin()">💳 Iuran Warga</button>
      </div>
    </div>
  
  `,false);

  
  try{
    const d=await api("/api/dashboard");

        <b>${d.complaints||0}</b>
      </div>

        <span>Saldo kas</span>

async function cash(){
  layout("Kas RT",`
    <div class="card">
      <h2>💰 Kas RT</h2>
      <p class="muted">Kelola dan pantau seluruh transaksi kas RT.</p>

      <button class="btn" onclick="addCash()">
        + Catat transaksi
      </button>
    </div>

    <div class="card">
      <h3>📊 Ringkasan Kas</h3>
      <div id="cashSummary">Memuat...</div>
    </div>
        <div class="card">
      <h3>📋 Rekap Kategori</h3>
      <div id="cashCategorySummary">Memuat...</div>
    </div>

    <div class="card">
      <h3>🔎 Filter Transaksi</h3>

      <label>Jenis transaksi</label>
      <select id="cashTypeFilter" onchange="filterCashAdmin()">
        <option value="">Semua</option>
        <option value="masuk">Pemasukan</option>
        <option value="keluar">Pengeluaran</option>
      </select>

      <label>Kategori</label>
      <select id="cashCategoryFilter" onchange="filterCashAdmin()">
        <option value="">Semua kategori</option>
        <option value="Iuran Warga">Iuran Warga</option>
        <option value="Keamanan">Keamanan</option>
        <option value="Sampah">Sampah</option>
        <option value="Kas RT">Kas RT</option>
        <option value="Kegiatan RT">Kegiatan RT</option>
        <option value="Sarana/Prasarana">Sarana/Prasarana</option>
        <option value="Pemasukan Lainnya">Pemasukan Lainnya</option>
<option value="Pengeluaran">Pengeluaran</option>
      </select>

      <button
        class="btn secondary"
        style="margin-top:12px"
        onclick="exportCash()"
      >
        📥 Export Kas RT
      </button>
    </div>

    <div class="card">
      <h3>📜 Riwayat Transaksi</h3>
      <div id="cashList">Memuat...</div>
    </div>
  `);

  try{
    const data = await api("/api/cash");

    window._cashAdminRows =
      Array.isArray(data) ? data : [];

    let masuk = 0;
    let keluar = 0;

    window._cashAdminRows.forEach(x=>{
      const jumlah = Number(x.amount) || 0;

      if(x.type === "keluar"){
        keluar += jumlah;
      }else{
        masuk += jumlah;
      }
    });

    const saldo = masuk - keluar;

    document.getElementById("cashSummary").innerHTML = `
      <div class="row">
        <b>Saldo Awal</b>
        <span>Rp0</span>
      </div>

      <div class="row">
        <b>💵 Total Pemasukan</b>
        <span>${rupiah(masuk)}</span>
      </div>

      <div class="row">
        <b>💸 Total Pengeluaran</b>
        <span>${rupiah(keluar)}</span>
      </div>

      <div class="row">
        <b>💰 Saldo Akhir</b>
        <span>${rupiah(saldo)}</span>
      </div>
    `;

    filterCashAdmin();
    
    

    const kategoriJumlah = {
      "Keamanan": 0,
      "Sampah": 0,
      "Kas RT": 0,
      "Iuran Warga": 0,
      "Kegiatan RT": 0,
      "Sarana/Prasarana": 0,
      "Pemasukan Lainnya": 0,
      "Pengeluaran": 0
    };

    window._cashAdminRows.forEach(x => {
      const kategori = getCashCategory(x);
      const jumlah = Number(x.amount) || 0;

      if(kategoriJumlah[kategori] !== undefined){
        kategoriJumlah[kategori] += jumlah;
      }
    });

    document.getElementById("cashCategorySummary").innerHTML = `
      <div class="row">
        <b>Keamanan</b>
        <span>${rupiah(kategoriJumlah["Keamanan"])}</span>
      </div>

      <div class="row">
        <b>Sampah</b>
        <span>${rupiah(kategoriJumlah["Sampah"])}</span>
      </div>

      <div class="row">
        <b>Kas RT</b>
        <span>${rupiah(kategoriJumlah["Kas RT"])}</span>
      </div>

      <div class="row">
        <b>Iuran Warga</b>
        <span>${rupiah(kategoriJumlah["Iuran Warga"])}</span>
      </div>

      <div class="row">
        <b>Kegiatan RT</b>
        <span>${rupiah(kategoriJumlah["Kegiatan RT"])}</span>
      </div>

      <div class="row">
        <b>Sarana/Prasarana</b>
        <span>${rupiah(kategoriJumlah["Sarana/Prasarana"])}</span>
      </div>

      <div class="row">
        <b>Pemasukan Lainnya</b>
        <span>${rupiah(kategoriJumlah["Pemasukan Lainnya"])}</span>
      </div>

      <div class="row">
        <b>Pengeluaran</b>
        <span>${rupiah(kategoriJumlah["Pengeluaran"])}</span>
      </div>
    `;

    filterCashAdmin();
  }catch(e){
    document.getElementById("cashSummary").innerHTML =
      `<div class="error">${esc(e.message)}</div>`;

    document.getElementById("cashList").innerHTML = "";
  }
}

function getCashCategory(x){
  const keterangan =
    String(x.description || "").toLowerCase();

  if(
    keterangan.includes("kas rt dari iuran") &&
    keterangan.includes("iuran_id")
  ){
    return "Iuran Warga";
  }

  if(keterangan.includes("keamanan")){
    return "Keamanan";
  }

  if(keterangan.includes("sampah")){
    return "Sampah";
  }

  if(keterangan.includes("kas rt")){
    return "Kas RT";
  }

  if(keterangan.includes("kegiatan")){
    return "Kegiatan RT";
  }

  if(
    keterangan.includes("sarana") ||
    keterangan.includes("prasarana")
  ){
    return "Sarana/Prasarana";
  }

  return x.type === "masuk"
  ? "Pemasukan Lainnya"
  : "Pengeluaran";
}

function filterCashAdmin(){
  const rows = Array.isArray(window._cashAdminRows)
    ? window._cashAdminRows
    : [];

  const type =
    document.getElementById("cashTypeFilter")?.value || "";

  const category =
    document.getElementById("cashCategoryFilter")?.value || "";

  const filtered = rows.filter(x=>{
    if(type && x.type !== type){
      return false;
    }

    const kat = getCashCategory(x);

    if(category && kat !== category){
      return false;
    }

    return true;
  });

  renderCashAdmin(filtered);
}

function renderCashAdmin(rows){
  const box = document.getElementById("cashList");

  if(!rows.length){
    box.innerHTML =
      "<p class='muted'>Belum ada transaksi.</p>";
    return;
  }

  box.innerHTML = rows.map((x,index)=>{
    const kategori = getCashCategory(x);

    return `
      <div class="row">
        <b>
          ${index + 1}.
          ${
            x.type === "keluar"
              ? "💸 Pengeluaran"
              : "💵 Pemasukan"
          }
        </b>

        <span class="badge">
          ${rupiah(Number(x.amount) || 0)}
        </span>

        <div>
          <b>Kategori:</b>
          ${esc(kategori)}
        </div>

        <div>
          <b>Tanggal:</b>
          ${esc(x.date || "")}
        </div>

        <div>
          <b>Keterangan:</b>
          ${esc(x.description || "")}
        </div>
      </div>
    `;
  }).join("");
}

function exportCash(){
  window.location.href="/api/cash/export";
}
function addCash(){
  layout("Catat Transaksi Kas",`

      <label>Jenis transaksi</label>
      <select id="cashType">
        <option value="masuk">Masuk</option>
        <option value="keluar">Keluar</option>

  async function verifikasiIuran(id){

      throw new Error(

    }

    alert("Pembayaran berhasil diverifikasi.");

    async function kasWarga(){
  layout("Kas RT",`
    <div class="card">
      <h2>💰 Transparansi Kas RT</h2>
      <div class="muted">Taman Bali Kahuripan</div>
    </div>

    <div class="card">
      <h3>📊 Ringkasan</h3>
      <div id="kasRingkasan">Memuat...</div>
    </div>

    <div class="card">
      <h3>📋 Rekap Kategori</h3>
      <div id="kasKategori">Memuat...</div>
    </div>

    <div class="card">
      <h3>📜 Riwayat Transaksi</h3>
      <div id="kasRiwayat">Memuat...</div>
    </div>
  `);

  try{
    const data = await api("/api/cash-warga");
    const rows = Array.isArray(data) ? data : [];

    let masuk = 0;
    let keluar = 0;

    const kategori = {};

    rows.forEach(x=>{
      const jumlah = Number(x.amount) || 0;

      if(x.type === "keluar"){
        keluar += jumlah;
      }else{
        masuk += jumlah;
      }

      const kat = x.kategori || "Lainnya";

      if(!kategori[kat]){
        kategori[kat] = {
          masuk:0,
          keluar:0
        };
      }

      if(x.type === "keluar"){
        kategori[kat].keluar += jumlah;
      }else{
        kategori[kat].masuk += jumlah;
      }
    });

    const saldo = masuk - keluar;

    document.getElementById("kasRingkasan").innerHTML = `
      <div class="row">
        <b>Saldo Awal</b>
        <span>Rp0</span>
      </div>

      <div class="row">
        <b>💵 Total Pemasukan</b>
        <span>${rupiah(masuk)}</span>
      </div>

      <div class="row">
        <b>💸 Total Pengeluaran</b>
        <span>${rupiah(keluar)}</span>
      </div>

      <div class="row">
        <b>💰 Saldo Akhir</b>
        <span>${rupiah(saldo)}</span>
      </div>
    `;

    const kategoriNama = [
      "Keamanan",
      "Sampah",
      "Kas RT",
      "Iuran Warga",
      "Pemasukan Lainnya",
      "Pengeluaran",
      "Kegiatan RT",
      "Sarana/Prasarana",
      "Lainnya"
    ];

    document.getElementById("kasKategori").innerHTML =
      kategoriNama.map(nama=>{
        const item = kategori[nama] || {
          masuk:0,
          keluar:0
        };

        return `
          <div class="row">
            <b>${esc(nama)}</b>
            <span>
              ${item.masuk ? "Masuk " + rupiah(item.masuk) : ""}
              ${item.keluar ? "Keluar " + rupiah(item.keluar) : ""}
              ${!item.masuk && !item.keluar ? "Rp0" : ""}
            </span>
          </div>
        `;
      }).join("");

    if(!rows.length){
      document.getElementById("kasRiwayat").innerHTML =
        "<p class='muted'>Belum ada transaksi.</p>";
      return;
    }

    document.getElementById("kasRiwayat").innerHTML =
      rows.map((x,index)=>{
        const waktu = x.waktu
          ? new Date(x.waktu).toLocaleString("id-ID")
          : "";

        return `
          <div class="row">
            <b>${index + 1}. ${
              x.type === "keluar"
                ? "💸 Pengeluaran"
                : "💵 Pemasukan"
            }</b>

            <span class="badge">
              ${rupiah(x.amount)}
            </span>

            <div>
              <b>Kategori:</b>
              ${esc(x.kategori || "Lainnya")}
            </div>

            ${
              x.nama_warga
                ? `<div><b>Warga:</b> ${esc(x.nama_warga)}</div>`
                : ""
            }

            ${
              x.periode
                ? `<div><b>Periode:</b> ${esc(x.periode)}</div>`
                : ""
            }

            ${
              x.total_iuran
                ? `<div><b>Total Iuran:</b> ${rupiah(x.total_iuran)}</div>`
                : ""
            }

            ${
              x.status_iuran
                ? `<div><b>Status:</b> ${esc(x.status_iuran)}</div>`
                : ""
            }

            ${
              x.diverifikasi_oleh
                ? `<div><b>Diverifikasi oleh:</b> ${esc(x.diverifikasi_oleh)}</div>`
                : ""
            }

            ${
              x.diverifikasi_at
                ? `<div><b>Waktu verifikasi:</b> ${new Date(x.diverifikasi_at).toLocaleString("id-ID")}</div>`
                : ""
            }

            <div><b>Tanggal:</b> ${esc(x.tanggal || "")}</div>

            ${
              waktu
                ? `<div><b>Waktu:</b> ${esc(waktu)}</div>`
                : ""
            }

            <div><b>Keterangan:</b> ${esc(x.description || "")}</div>
          </div>
        `;
      }).join("");

  }catch(e){
    document.getElementById("kasRingkasan").innerHTML =
      `<div class="error">${esc(e.message)}</div>`;

    document.getElementById("kasKategori").innerHTML = "";

    document.getElementById("kasRiwayat").innerHTML = "";
  }
}
