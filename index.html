<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1267c9">
<link rel="manifest" href="/manifest.webmanifest">
<title>RT Kita</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #00000010}
h1,h2,h3{margin-top:0}
.logo{text-align:center;margin:35px 0 20px}
.logo h1{color:#1267c9;margin-bottom:5px}
.muted{color:#687386}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 16px;background:#1267c9;color:white;font-weight:700}
.btn.secondary{background:#e8eef7;color:#174a82}
.btn.danger{background:#c62828}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:16px;border-radius:14px;background:#eef5ff}
.stat b{display:block;font-size:25px;color:#1267c9}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{padding:15px;border:1px solid #dbe3ee;border-radius:12px;background:white;text-align:left;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.hidden{display:none!important}
.row{padding:13px 0;border-bottom:1px solid #e8edf3}
.row:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f1ff;color:#1267c9;font-size:12px;font-weight:700}
.bottom{position:sticky;bottom:0;background:white;border-top:1px solid #ddd;padding:9px;display:flex;justify-content:space-around;margin:20px -16px -16px}
.bottom button{border:0;background:transparent;font-size:12px}
.error{background:#ffebee;color:#b71c1c;padding:10px;border-radius:10px;margin-bottom:12px}
.success{background:#e8f5e9;color:#176b20;padding:10px;border-radius:10px;margin-bottom:12px}
</style>
</head>

<body>
<div id="app"></div>

<script>
let currentUser=null;

async function api(url,options={}){
  const res=await fetch(url,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    },
    ...options
  });

  const text=await res.text();
  let data=null;

  try{data=text?JSON.parse(text):null}
  catch{data={message:text}}

  if(!res.ok){
    throw new Error(data?.message||data?.error||"Terjadi kesalahan");
  }

  return data;
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function rupiah(value){
  return "Rp "+Number(value||0).toLocaleString("id-ID");
}

function layout(title,body,showBack=true){
  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="top">
        <div>
          <b style="color:#1267c9">RT Kita</b>
          <div class="muted">${esc(title)}</div>
        </div>
        <button class="btn secondary" onclick="logout()">Keluar</button>
      </div>

      ${body}

      ${showBack ? `
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn secondary" onclick="dashboard()">
      ← Kembali ke Dashboard
    </button>
  </div>
` : ""}
    </div>`;
}

function dashboard(){
  boot();
}

function loginPage(error=""){
  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="logo">
        <h1>RT Kita</h1>
        <div class="muted">Pelayanan warga digital</div>
      </div>

      <div class="card">
        <h2>Masuk</h2>

        ${error?`<div class="error">${esc(error)}</div>`:""}

        <label>Masuk sebagai</label>
        <select id="role" onchange="changeLoginForm()">
          <option value="admin">Ketua RT</option>
          <option value="warga">Warga</option>
        </select>

        <div id="loginFields"></div>

        <button class="btn" style="width:100%;margin-top:16px"
          onclick="doLogin()">Masuk aplikasi</button>
      </div>
    </div>`;

  changeLoginForm();
}

function changeLoginForm(){
  const role=document.getElementById("role")?.value;
  const box=document.getElementById("loginFields");
  if(!box)return;

  if(role==="warga"){
    box.innerHTML=`
      <label>NIK</label>
      <input id="username" inputmode="numeric" placeholder="Masukkan NIK">

      <label>No. KK</label>
      <input id="password" inputmode="numeric" placeholder="Masukkan No. KK">
    `;
  }else{
    box.innerHTML=`
      <label>Username</label>
      <input id="username" value="admin" autocomplete="username">

      <label>Password</label>
      <input id="password" type="password" placeholder="Password">
    `;
  }
}

async function doLogin(){
  const role=document.getElementById("role").value;
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!username||!password){
    loginPage("Data login wajib diisi");
    document.getElementById("role").value=role;
    changeLoginForm();
    return;
  }

  try{
    const data=await api("/api/login",{
      method:"POST",
      body:JSON.stringify({username,password,role})
    });

    currentUser=data.user;

    if(currentUser.role==="warga"){
      wargaHome();
    }else{
      adminHome();
    }
  }catch(e){
    loginPage(e.message);
    document.getElementById("role").value=role;
    changeLoginForm();
  }
}

async function boot(){
  try{
    const data=await api("/api/me");
    currentUser=data.user;

    if(currentUser.role==="warga") wargaHome();
    else adminHome();
  }catch{
    loginPage();
  }
}

async function logout(){
  try{await api("/api/logout",{method:"POST"})}catch{}
  currentUser=null;
  loginPage();
}

    }else{

      onclick="verifikasiIuran('${item.id}')"
      style="margin-top:10px"

      ✅ Verifikasi Pembayaran

  `
  : ""
}
          </div>
        `;
      });

      html+=`</div>`;
    }

    html+=`
      
    `;

    layout("Iuran Warga",html);

  }catch(e){
    alert(e.message || "Gagal mengambil data iuran");
  }
}
  async function verifikasiIuran(id){
  if(!id) return;

  if(!confirm("Verifikasi pembayaran iuran ini?")){
    return;
  }

  try{
    const hasil = await api("/api/iuran/verifikasi",{
      method:"POST",
      body:JSON.stringify({id})
    });

    if(!hasil || !hasil.ok){
      throw new Error(
        hasil?.message || "Gagal memverifikasi iuran"
      );
    }

    alert("Pembayaran berhasil diverifikasi.");
    await iuranAdmin();

  }catch(e){
    alert(e.message || "Gagal memverifikasi iuran");
  }
}

  async function konfirmasiIuran(){

  String(sekarang.getMonth() + 1).padStart(2, "0") +
  "-01";
    const hasil = await api("/api/iuran/bayar", {
      method: "POST",

  bulan
})

          </div>
        </div>

        </p>

      </button>
    `);

  }catch(e){
    alert(e.message || "Gagal menyimpan pembayaran iuran");
  }
}
  async function iuranWarga(){
  const security=15000;
  const sampah=15000;
  const kasRt=5000;
  const total=security+sampah+kasRt;

  try{
    const data=await api("/api/my-iuran");

    const item=Array.isArray(data) && data.length
      ? data[0]
      : null;

    const status=item?.status || "Belum Lunas";

    layout("Iuran Warga",`
      <div class="card">
        <h2>💳 Iuran Warga</h2>
        <p class="muted">
          Iuran rutin warga Taman Bali Kahuripan
        </p>
      </div>

      <div class="card">
        <div class="row">
          <b>🛡️ Security</b>
          <div>${rupiah(security)} / bulan</div>
          <div style="margin-top:6px">
            <span class="badge">${status}</span>
          </div>
        </div>

        <div class="row">

    async function kasWarga(){
  try{
    const data=await api("/api/cash-warga");

    let masuk=0;
    let keluar=0;

    if(Array.isArray(data)){
      data.forEach(x=>{
        const jumlah=Number(x.amount)||0;

        if(x.type==="keluar"){
          keluar+=jumlah;
        }else{
          masuk+=jumlah;
        }
      });
    }

    const saldo=masuk-keluar;

    let html=`
      <div class="card">
        <h2>💰 Kas RT</h2>
        <p class="muted">
          Transparansi kas warga Taman Bali Kahuripan
        </p>
      </div>

      <div class="card">
        <div class="row">
          <b>💵 Total Kas Masuk</b>
          <span class="badge">${rupiah(masuk)}</span>
        </div>

        <div class="row">
          <b>💸 Total Kas Keluar</b>
          <span class="badge">${rupiah(keluar)}</span>
        </div>

        <div class="row">
          <b>💰 Saldo Kas</b>
          <span class="badge">${rupiah(saldo)}</span>
        </div>
      </div>

      <div class="card">
        <h3>📋 Riwayat Kas</h3>
    `;

    if(!Array.isArray(data) || data.length===0){
      html+=`<p class="muted">Belum ada transaksi kas.</p>`;
    }else{
      data.forEach(x=>{
        html+=`
          <div class="row">
            <b>${x.type==="keluar"?"💸 Pengeluaran":"💵 Pemasukan"}</b>
            <span class="badge">${rupiah(x.amount||0)}</span>
            <div>${esc(x.description||"-")}</div>
          </div>
        `;
      });
    }

    html+=`
      </div>

      
    `;

    layout("Kas RT",html);

  }catch(e){
    alert(e.message || "Gagal mengambil data kas");
  }
}

function newLetter(){
  layout("Ajukan Surat",`
    <div class="card">
      <label>Jenis surat</label>
      <select id="letterType">
        <option value="">-- Pilih jenis surat --</option>
        <option value="Surat Pengantar">Surat Pengantar</option>
        <option value="Surat Keterangan Domisili">Surat Keterangan Domisili</option>
        <option value="Surat Keterangan Tidak Mampu">Surat Keterangan Tidak Mampu</option>
        <option value="Surat Keterangan Usaha">Surat Keterangan Usaha</option>
        <option value="Surat Pengantar SKCK">Surat Pengantar SKCK</option>
      </select>

      <label>Keperluan</label>
      <textarea id="letterPurpose"
        placeholder="Tuliskan keperluan surat"></textarea>

      <button class="btn" style="margin-top:16px" onclick="saveLetter()">
        Ajukan surat
      </button>

      <button class="btn secondary" style="margin-top:8px" onclick="wargaHome()">
        Kembali
      </button>
    </div>
  `);
}

async function saveLetter(){
  try{
    await api("/api/letters",{
      method:"POST",
      body:JSON.stringify({
        type:document.getElementById("letterType").value,
        purpose:document.getElementById("letterPurpose").value.trim()
      })
    });

    alert("Pengajuan surat berhasil dikirim");
    myLetters();
  }catch(e){
    alert(e.message);
  }
}

async function myLetters(){
  layout("Surat Saya",`
    <div class="card" id="myLetterList">Memuat...</div>
    <button class="btn" onclick="newLetter()">+ Ajukan surat</button>
    <button class="btn secondary" style="margin-top:8px" onclick="wargaHome()">Kembali</button>
  `);

  try{
    const data=await api("/api/my-letters");
    const box=document.getElementById("myLetterList");

    if(!data.length){
      box.innerHTML="<p class='muted'>Belum ada pengajuan surat</p>";
      return;
    }

    box.innerHTML=data.map(x=>`
      <div class="row">
        <b>${esc(x.type||x.jenis_surat)}</b>
        <div>${esc(x.purpose||x.keperluan)}</div>
        <div style="margin-top:6px">
          <span class="badge">${esc(x.status)}</span>
        </div>
        ${x.catatan?`<div class="muted">Catatan RT: ${esc(x.catatan)}</div>`:""}
      </div>
    `).join("");
  }catch(e){
    document.getElementById("myLetterList").innerHTML=
      `<div class="error">${esc(e.message)}</div>`;
  }
}
