async function api(url, options = {}) {
  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const res = await fetch(url, {
    ...options,
    credentials: "same-origin",
    headers
  });

  const text = await res.text();
  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = { message: text };
  }

  if (!res.ok) {
    const message =
      data?.message ||
      data?.error ||
      `Permintaan gagal (HTTP ${res.status})`;

    console.error("API ERROR:", {
      url,
      status: res.status,
      response: data
    });

    throw new Error(message);
  }

  return data;
}

  function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function rupiah(value) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}
window.onerror = function(message, source, line, column, error) {
  console.error(
    "PELACAK ERROR RT KITA\n\n" +
    "Pesan: " + message + "\n" +
    "Baris: " + line + "\n" +
    "Kolom: " + column + "\n" +
    "Sumber: " + source
  );
};

async function muatNotifikasiHeader() {
  try {
    const hasil = await api("/api/notifikasi");
    const jumlah = document.getElementById("jumlahNotifikasiHeader");

    if (!jumlah || !hasil || !hasil.ok) return;

    const belumDibaca = Number(hasil.belum_dibaca || 0);

    jumlah.textContent = belumDibaca > 99 ? "99+" : belumDibaca;
    jumlah.style.display = belumDibaca > 0 ? "flex" : "none";
  } catch (error) {
    console.error("Gagal memuat jumlah notifikasi:", error);
  }
}

  

async function bukaNotifikasiHeader() {
  try {
    const hasil = await api("/api/notifikasi");

    if (!hasil || !hasil.ok) {
      throw new Error(hasil?.message || "Gagal memuat notifikasi");
    }

    const daftar = hasil.notifikasi || [];

    const lama = document.getElementById("panelNotifikasiHeader");
    if (lama) lama.remove();

    const panel = document.createElement("div");
    panel.id = "panelNotifikasiHeader";

    panel.style.cssText = `
      position:fixed;
      top:90px;
      right:16px;
      width:min(380px,calc(100vw - 32px));
      max-height:70vh;
      overflow:auto;
      padding:16px;
      background:white;
      color:#243447;
      border:1px solid #dce6f2;
      border-radius:14px;
      box-shadow:0 10px 35px #0003;
      z-index:9999;
      box-sizing:border-box;
    `;

    function tampilkanDaftar(items) {
      const isi = items.length
        ? items.map(item => `
            <div style="
              padding:12px;
              margin-bottom:8px;
              border:1px solid #dce6f2;
              border-radius:10px;
              background:${item.sudah_dibaca ? "#ffffff" : "#eef6ff"};
            ">
              <div style="font-weight:800;color:#174a82">
                ${esc(item.judul || "Notifikasi")}
              </div>
              <div style="margin-top:5px">
                ${esc(item.pesan || "")}
              </div>
              <div style="font-size:12px;color:#64748b;margin-top:7px">
                ${item.dibuat_pada
                  ? new Date(item.dibuat_pada).toLocaleString("id-ID")
                  : ""}
                · ${item.sudah_dibaca ? "Sudah dibaca" : "Belum dibaca"}
              </div>
            </div>
          `).join("")
        : "<p>Belum ada notifikasi.</p>";

      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <strong style="font-size:18px">Notifikasi</strong>
          <button type="button" class="btn secondary"
            id="tutupNotifikasiHeader">
            Tutup
          </button>
        </div>
        <div id="isiNotifikasiHeader">${isi}</div>
      `;

      document.getElementById("tutupNotifikasiHeader")
        ?.addEventListener("click", () => panel.remove());
    }

    document.body.appendChild(panel);
    tampilkanDaftar(daftar);

    // Tandai notifikasi yang belum dibaca.
    for (const item of daftar.filter(n => !n.sudah_dibaca)) {
      const hasilBaca = await api(
        `/api/notifikasi/${encodeURIComponent(item.id)}/baca`,
        { method: "PATCH" }
      );

      if (!hasilBaca || !hasilBaca.ok) {
        throw new Error(
          hasilBaca?.message || `Gagal membaca notifikasi ${item.id}`
        );
      }

      item.sudah_dibaca = true;
    }

    // Perbarui daftar dan angka lonceng.
    tampilkanDaftar(daftar);
    await muatNotifikasiHeader();

  } catch (error) {
    console.error("Gagal membuka notifikasi:", error);
    alert("Gagal memperbarui notifikasi: " + error.message);
  }
}

document.addEventListener("keydown", e => {
  if (
    e.key === "Enter" &&
    !currentUser &&
    e.target &&
    (e.target.id === "username" || e.target.id === "password")
  ) {
    e.preventDefault();
    doLogin();
  }
});

async function doLogin(){
  const role=document.getElementById("role").value;
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!username||!password){
    loginPage("Data login wajib diisi");
    document.getElementById("role").value=role;
    changeLoginForm();
    return;
  }

  try{
    const data=await api("/api/login",{
      method:"POST",
      body:JSON.stringify({username,password,role})
    });

    currentUser=data.user;

    if(currentUser.role==="warga"){
      wargaHome();
    }else{
      adminHome();
    }
  }catch(e){
    loginPage(e.message);
    document.getElementById("role").value=role;
    changeLoginForm();
  }
}

function filterResidents(){
  const data = Array.isArray(window._residentRows)
    ? window._residentRows
    : [];

  const input = document.getElementById("residentSearch");
  const box = document.getElementById("residentList");
  const count = document.getElementById("residentCount");

  if(!input || !box) return;

  const q = input.value.trim().toLowerCase();

  const filtered = data.filter(w => [
    w.nama_lengkap,
    w.nama,
    w.nik,
    w.no_kk,
    w.no_hp,
    w.alamat,
    w.status_warga
  ].some(v => String(v || "").toLowerCase().includes(q)));

  if(count){
    count.textContent =
      `Menampilkan ${filtered.length} dari ${data.length} warga`;
  }

  if(!filtered.length){
    box.innerHTML =
      "<p class='muted'>Warga tidak ditemukan.</p>";
    return;
  }

  box.innerHTML = filtered.map(w=>`
    <div class="row"
      style="cursor:pointer"
      onclick='showResidentDetail(${JSON.stringify(w).replace(/'/g,"&#39;")})'>

      <b>${esc(w.nama_lengkap||w.nama)}</b>
      <div class="muted">NIK: ${esc(w.nik)}</div>
      <div class="muted">No. KK: ${esc(w.no_kk)}</div>
      <div class="muted">${esc(w.alamat)}</div>
      <div class="muted">${esc(w.no_hp)}</div>

      <div class="muted" style="margin-top:6px">
        Status: ${esc(w.status_warga || "")}
      </div>

      ${
        w.status_warga === "menunggu_verifikasi"
        ? `
          <button class="btn" style="margin-top:8px"
            onclick="event.stopPropagation(); verifyResident(${w.id})">
            ✅ Verifikasi
          </button>
        `
        : w.status_warga === "aktif"
        ? `
          <button class="btn secondary" style="margin-top:8px"
            onclick="event.stopPropagation(); deactivateResident(${w.id})">
            ⛔ Nonaktifkan
          </button>
        `
        : ""
      }
    </div>
  `).join("");
}

async function activateResident(id){
  if (!confirm("Aktifkan kembali warga ini?")) return;

  try {
    const result = await api(
      `/api/residents/${encodeURIComponent(id)}/activate`,
      { method: "PATCH" }
    );

    if (!result || result.ok !== true) {
      alert(result?.message || "Gagal mengaktifkan warga");
      return;
    }

    alert("Warga berhasil diaktifkan kembali");
    residents();
  } catch (error) {
    console.error("ACTIVATE RESIDENT ERROR:", error);
    alert("Gagal mengaktifkan warga. Silakan coba lagi.");
  }
}



async function saveResident(event,id){
  event.preventDefault();

  const keys = [
    "nik","no_kk","nama_lengkap",
    "tempat_lahir","tanggal_lahir","alamat","rt","rw",
    "pekerjaan","no_hp","jenis_kelamin",
    "status_perkawinan","status_hunian","hubungan_keluarga"
  ];

  const body = {};

  for(const key of keys){
    const el = document.getElementById("edit_"+key);

    if(el){
      const value = el.value.trim();

      if(el.tagName === "SELECT" && !value){
        continue;
      }

      if(key === "tanggal_lahir"){
        body[key] = value || null;
      }else{
        body[key] = value;
      }
    }
  }

  try{
    const result = await api(`/api/residents/${encodeURIComponent(id)}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    if(result && result.ok === false){
      throw new Error(result.message || "Gagal menyimpan data");
    }

    alert("Data warga berhasil diperbarui.");
    residents();
  }catch(error){
    alert("Gagal menyimpan data: "+error.message);
  }
}

function getCashCategory(x){
  const kategori = String(x.kategori || "").trim();
  const keterangan =
    String(x.description || x.keterangan || "").toLowerCase();

  // Kategori yang sudah dipilih saat pencatatan selalu dipakai.
  // Tebakan dari keterangan hanya untuk data lama tanpa kategori spesifik.
  if(
    kategori &&
    !["Iuran Warga","Pemasukan Lainnya","Pengeluaran","Lainnya"].includes(kategori)
  ){
    return kategori;
  }

  if(keterangan.includes("keamanan")){
    return "Keamanan";
  }

  if(keterangan.includes("sampah")){
    return "Sampah";
  }

  if(keterangan.includes("kas rt")){
    return "Kas RT";
  }

  if(kategori){
    return kategori;
  }

  if(keterangan.includes("kegiatan")){
    return "Kegiatan RT";
  }

  if(
    keterangan.includes("sarana") ||
    keterangan.includes("prasarana")
  ){
    return "Sarana/Prasarana";
  }

  return x.type === "masuk"
    ? "Pemasukan Lainnya"
    : "Pengeluaran";
}
function renderCashMonthly() {

function filterCashAdmin(){
  const rows = Array.isArray(window._cashAdminRows)
    ? window._cashAdminRows
    : [];

  const type =
    document.getElementById("cashTypeFilter")?.value || "";

  const category =
    document.getElementById("cashCategoryFilter")?.value || "";

  const filtered = rows.filter(x=>{
    if(type && x.type !== type){
      return false;
    }

    const kat = getCashCategory(x);

    if(category && kat !== category){
      return false;
    }

    return true;
  });

  renderCashAdmin(filtered);
}

async function lihatBuktiCash(id){
  let tab = null;

  try{
    if(!id || !Number.isInteger(Number(id))){
      alert("ID transaksi tidak valid.");
      return;
    }

    tab = window.open("about:blank", "_blank");

    const hasil = await api(
      `/api/cash/proof/${encodeURIComponent(id)}`
    );

    if(!hasil || !hasil.ok || !hasil.url){
      throw new Error(
        hasil?.message || "Bukti pengeluaran tidak ditemukan."
      );
    }

    if(tab){
      tab.location.href = hasil.url;
    }else{
      window.location.href = hasil.url;
    }

  }catch(e){
    if(tab){
      tab.close();
    }

    alert(
      e.message || "Gagal membuka bukti pengeluaran."
    );
  }
}

// Perkecil foto bukti (maks. 1600px, JPEG) agar selalu di bawah batas upload server.
async function kompresFotoBukti(fileAsli){
  if (!fileAsli) throw new Error("Bukti pengeluaran wajib dilampirkan.");
  if (fileAsli.size > 25 * 1024 * 1024) {
    throw new Error("Ukuran foto terlalu besar (maks. 25 MB).");
  }

  const url = URL.createObjectURL(fileAsli);
  try {
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error("Format foto tidak didukung. Gunakan foto JPG atau PNG."));
      el.src = url;
    });

    const MAKS = 1600;
    const skala = Math.min(1, MAKS / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * skala));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * skala));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let kualitas = 0.82;
    let blob = null;
    for (let i = 0; i < 5; i++) {
      blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", kualitas));
      if (blob && blob.size <= 3 * 1024 * 1024) break;
      kualitas -= 0.15;
    }

    if (!blob || blob.size > 4 * 1024 * 1024) {
      throw new Error("Foto bukti terlalu besar. Coba foto ulang dengan resolusi lebih kecil.");
    }

    return new File([blob], "bukti.jpg", { type: "image/jpeg" });
  } finally {
    URL.revokeObjectURL(url);
  }
}

let cashSaving = false;


async function saveCash(){
  if (cashSaving) return;

  const tombolSimpan = document.getElementById("cashSaveBtn");
  if (!tombolSimpan) return;

  cashSaving = true;
  tombolSimpan.disabled = true;
  tombolSimpan.textContent = "Menyimpan...";

  let transaksiBerhasil = false;

  try {
    const type = document.getElementById("cashType").value;
    const category = document.getElementById("cashCategory").value;
    const date = document.getElementById("cashDate").value;
    const description = document.getElementById("cashDesc").value.trim();
    const amount = document.getElementById("cashAmount").value;
    const proofInput = document.getElementById("cashProof");

    if (
      !category ||
      !date ||
      !description ||
      !amount ||
      !Number.isFinite(Number(amount)) ||
      Number(amount) <= 0
    ) {
      alert("Lengkapi kategori, tanggal, keterangan, dan jumlah.");
      return;
    }

    let proofPath = null;

    if (type === "keluar") {
      if (!proofInput || !proofInput.files.length) {
        alert("Bukti pengeluaran wajib dilampirkan.");
        return;
      }

      tombolSimpan.textContent = "Menyiapkan foto...";

      let file;
      try {
        file = await kompresFotoBukti(proofInput.files[0]);
      } catch (err) {
        alert(err.message || "Foto bukti tidak dapat dibaca. Coba foto ulang atau pilih file JPG/PNG.");
        return;
      }

      tombolSimpan.textContent = "Mengunggah bukti...";

      const uploadResponse = await fetch("/api/cash/proof", {
        method: "POST",
        headers: {
          "Content-Type": file.type
        },
        body: file
      });

      let uploadResult = {};
      try {
        uploadResult = await uploadResponse.json();
      } catch (_) {
        uploadResult = {
          ok: false,
          message: uploadResponse.status === 413
            ? "Foto bukti terlalu besar untuk diunggah."
            : "Gagal mengunggah bukti (HTTP " + uploadResponse.status + ")."
        };
      }

      if (
        !uploadResponse.ok ||
        !uploadResult.ok ||
        !uploadResult.path
      ) {
        throw new Error(
          uploadResult.message || "Gagal mengunggah bukti."
        );
      }

      proofPath = uploadResult.path;
    }

    tombolSimpan.textContent = "Menyimpan transaksi...";

    await api("/api/cash", {
      method: "POST",
      body: JSON.stringify({
        type,
        category,
        date,
        description,
        amount,
        proof: proofPath
      })
    });

    transaksiBerhasil = true;

    alert("Transaksi berhasil disimpan.");
    await cash();

  } catch (e) {
    alert(
      e.message ||
      "Hasil penyimpanan belum dapat dipastikan. Periksa riwayat kas sebelum mencoba lagi."
    );
  } finally {
    cashSaving = false;

    // Pulihkan tombol hanya jika formulir masih ditampilkan.
    const tombolSaatIni = document.getElementById("cashSaveBtn");

    if (tombolSaatIni && !transaksiBerhasil) {
      tombolSaatIni.disabled = false;
      tombolSaatIni.textContent = "Simpan transaksi";
    }
  }
}

async function processLetter(id, status){
  const catatan = status === "ditolak"
    ? prompt("Alasan penolakan surat:")
    : prompt("Catatan Ketua RT (boleh dikosongkan):");

  if(catatan === null) return;

  if(status === "ditolak" && !catatan.trim()){
    alert("Mohon isi alasan penolakan.");
    return;
  }

  if(!confirm(
    status === "disetujui"
      ? "Setujui pengajuan surat ini?"
      : "Tolak pengajuan surat ini?"
  )) return;

  try{
    const result = await api("/api/letters/" + id, {
      method: "PATCH",
      body: JSON.stringify({ status, catatan })
    });

    if(result && result.ok){
      alert(result.message || "Status surat berhasil diperbarui.");
      await letters();
    }else{
      alert(result?.message || "Gagal memproses surat.");
    }
  }catch(e){
    alert(e.message || "Gagal memproses surat.");
  }
}

async function iuranWarga(){
  const security = 15000;
  const sampah = 15000;
  const kasRt = 5000;
  const total = security + sampah + kasRt;

  try {
    const data = await api("/api/my-iuran");
    const rows = Array.isArray(data) ? data : [];

    const sekarang = new Date();
    const bulanIni = new Date(
      sekarang.getFullYear(),
      sekarang.getMonth(),
      1
    );

    // Mulai dari bulan tertua yang belum lunas (sejak awal pencatatan
    // Oktober 2026), supaya tunggakan bulan sebelumnya tetap bisa dipilih.
    const awalPencatatan = new Date(2026, 9, 1);
    const kunciBulan = d =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
    let awal = new Date(bulanIni);
    for (
      let d = new Date(awalPencatatan);
      d < bulanIni;
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1)
    ) {
      const rec = rows.find(x => String(x.bulan).slice(0, 10) === kunciBulan(d));
      if (!rec || rec.status !== "lunas") {
        awal = new Date(d);
        break;
      }
    }
    if (awal < awalPencatatan) awal = new Date(awalPencatatan);

    // Tampilkan dari bulan tersebut sampai 11 bulan ke depan dari bulan ini.
    const jumlahBulan =
      (bulanIni.getFullYear() - awal.getFullYear()) * 12 +
      (bulanIni.getMonth() - awal.getMonth()) + 12;

    const bulanList = [];
    for (let i = 0; i < jumlahBulan; i++) {
      const d = new Date(awal.getFullYear(), awal.getMonth() + i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;

      const record = rows.find(x => String(x.bulan).slice(0, 10) === key);

      bulanList.push({
        key,
        label: d.toLocaleDateString("id-ID", {
          month: "long",
          year: "numeric"
        }),
        status: record?.status || "belum_dibayar"
      });
    }

    const statusLabel = status => {
      if (status === "lunas") return "Lunas";
      if (status === "menunggu_verifikasi") return "Menunggu verifikasi";
      return "Belum lunas";
    };

    layout("Iuran Warga", `
      <div class="card">
        <h2>💳 Iuran Warga</h2>
        <p class="muted">Pilih satu atau beberapa bulan yang ingin diajukan.</p>
        <div style="background:#eef5ff;padding:14px;border-radius:12px">
          <b>Iuran per bulan: ${rupiah(total)}</b>
          <div class="muted" style="font-size:13px;margin-top:5px">
            Keamanan Rp15.000 + Sampah Rp15.000 + Kas RT Rp5.000
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Status dan Pilihan Bulan</h3>
        <div style="display:grid;gap:8px">
          ${bulanList.map(b => {
            const lunas = b.status === "lunas";
            const pending = b.status === "menunggu_verifikasi";
            const tidakBisaDipilih = lunas || pending;

            return `
              <label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #dbe5f1;border-radius:12px">
                <input
                  type="checkbox"
                  class="pilih-bulan-iuran"
                  value="${b.key.slice(0, 7)}"
                  ${tidakBisaDipilih ? "disabled" : ""}
                  style="width:18px;height:18px"
                >
                <span style="flex:1">
                  <b>${b.label}</b>
                  <div style="font-size:12px;margin-top:4px;color:${lunas ? "#16834a" : pending ? "#b45309" : "#64748b"}">
                    ${statusLabel(b.status)}
                  </div>
                </span>
                <b style="font-size:13px;white-space:nowrap">${rupiah(total)}</b>
              </label>
            `;
          }).join("")}
        </div>
        <div id="ringkasanPilihIuran" style="margin-top:16px;background:#eef5ff;padding:14px;border-radius:12px">
          <div>Jumlah bulan dipilih: <b id="jumlahBulanIuran">0</b></div>
          <div style="margin-top:6px">Total: <b id="totalPilihIuran">${rupiah(0)}</b></div>
        </div>
        <div id="pesanPilihIuran" style="margin-top:10px"></div>
        <button class="btn" id="btnAjukanIuran" style="width:100%;margin-top:12px" disabled>
          💳 Ajukan Pembayaran
        </button>
      </div>
    `);

    const pilihan = [...document.querySelectorAll(".pilih-bulan-iuran")];
    const tombol = document.getElementById("btnAjukanIuran");
    const pesan = document.getElementById("pesanPilihIuran");

    function perbaruiRingkasan(){
      const dipilih = pilihan.filter(x => x.checked);
      document.getElementById("jumlahBulanIuran").textContent = dipilih.length;
      document.getElementById("totalPilihIuran").textContent = rupiah(dipilih.length * total);
      tombol.disabled = dipilih.length === 0;
      pesan.innerHTML = "";
    }

    pilihan.forEach(x => x.addEventListener("change", perbaruiRingkasan));

    tombol.addEventListener("click", async () => {
      const dipilih = pilihan.filter(x => x.checked)
        .map(x => x.value)
        .sort();

      if (!dipilih.length) return;

      // Untuk saat ini server lama menerima satu bulan per pengajuan.
      // Kirim bulan satu per satu; jika ada tunggakan, hentikan.
      tombol.disabled = true;
      tombol.textContent = "Memproses...";
      pesan.textContent = "";

 try {

 
await api("/api/iuran/bayar-banyak", {
  method: "POST",
  body: JSON.stringify({ bulans: dipilih })
});


        alert("Pengajuan iuran berhasil dikirim.");
        await iuranWarga();
      } catch (e) {
        pesan.innerHTML = `
          <div style="background:#fff1f2;color:#b91c1c;padding:12px;border-radius:10px">
            <b>Pembayaran tidak bisa diproses</b>
            <div style="margin-top:5px">${esc(e.message || "Periksa tunggakan bulan sebelumnya.")}</div>
          </div>
        `;
      } finally {
        tombol.disabled = false;
        tombol.textContent = "💳 Ajukan Pembayaran";
      }
    });

  } catch(e) {
    alert(e.message || "Gagal mengambil data iuran");
  }
}

function openMyLetter(index){
  const letters = window._myLetters || [];
  const x = letters[index];

  if (!x) {
    alert("Data surat tidak ditemukan. Silakan buka Surat Saya kembali.");
    return;
  }

  const status = String(x.status || "diajukan");
  const approved = status.toLowerCase() === "disetujui";

  layout("Detail Surat Saya",`
    <div class="card">
      <div style="text-align:center;padding:10px 0 18px">
        <div style="font-size:36px">📄</div>
        <h2 style="margin:8px 0">
          ${esc(x.type || x.jenis_surat || "Pengajuan Surat")}
        </h2>
        <span class="badge">${esc(status)}</span>
      </div>

      <div class="row">
        <div class="muted">Jenis surat</div>
        <b>${esc(x.type || x.jenis_surat || "-")}</b>
      </div>

      <div class="row">
        <div class="muted">Keperluan</div>
        <div>${esc(x.purpose || x.keperluan || "-")}</div>
      </div>

      <div class="row">
        <div class="muted">Tanggal pengajuan</div>
        <div>${
          x.created_at
            ? esc(new Date(x.created_at).toLocaleDateString("id-ID", {
                day:"numeric", month:"long", year:"numeric"
              }))
            : "-"
        }</div>
      </div>

      <div class="row">
        <div class="muted">Status persetujuan</div>
        <b style="color:${approved ? "#16803c" : "#1267c9"}">
          ${approved ? "✓ Telah disetujui Ketua RT" :
            status.toLowerCase() === "ditolak" ? "Pengajuan ditolak" :
            "Menunggu proses Ketua RT"}
        </b>
      </div>

      ${x.catatan ? `
        <div class="row">
          <div class="muted">Catatan Ketua RT</div>
          <div>${esc(x.catatan)}</div>
        </div>
      ` : ""}

      ${approved ? `
        <div style="
          margin-top:16px;
          padding:14px;
          border-radius:12px;
          background:#edf7ef;
          color:#245b32;
        ">
          <b>Surat telah disetujui.</b>
          <div style="font-size:13px;margin-top:5px">
            Silakan unduh PDF untuk diperiksa sebelum digunakan.
          </div>
        </div>

        <button class="btn"
          style="width:100%;margin-top:12px"
          onclick="downloadMyLetterPDF(${Number(x.id)})">
          ↓ Unduh PDF Surat
        </button>
      ` : ""}

      <button class="btn secondary"
        style="width:100%;margin-top:16px"
        onclick="myLetters()">
        ← Kembali ke Surat Saya
      </button>
    </div>
  `);
}

async function downloadMyLetterPDF(id){
  if (!Number.isInteger(id) || id <= 0) {
    alert("ID surat tidak valid.");
    return;
  }

  try {
    const response = await fetch(
      "/api/my-letters/" + encodeURIComponent(id) + "/pdf",
      {
        method: "GET",
        credentials: "same-origin"
      }
    );

    if (!response.ok) {
      let message = "Gagal mengunduh PDF surat.";
      try {
        const data = await response.json();
        if (data.message) message = data.message;
      } catch (_) {}
      alert(message);
      return;
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "surat-rt-tbk-" + id + ".pdf";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    console.error("DOWNLOAD PDF ERROR:", error);
    alert("Koneksi gagal. Silakan coba unduh kembali.");
  }
}
